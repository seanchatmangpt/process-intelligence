  - id: CLM-CHECKPOINTS-009
    claim: >
      The checkpoint ledger constitutes a process truth authority by applying process-mining
      conformance reflexively to the research program itself: the declared process model is the gate
      criteria table, the event log is the artifact inventory, and the conformance score is the gate
      pass ratio (12/12 = fitness 1.0).
    claim_type: AUTHOR_THESIS
    source_files:
      - /Users/sac/process-intelligence/checkpoints/ALIVE_GATE_ASSESSMENT.md
      - /Users/sac/process-intelligence/checkpoints/PROCESS_INTELLIGENCE_ALIVE_001.md
    evidence_summary: >
      The analogy between conformance checking and gate assessment is the author's interpretive
      framing; the underlying gate counts (12/12) are source-supported, but the characterization as
      fitness 1.0 and process truth authority is an analytical thesis claim.
    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-CHECKPOINTS-010
    claim: >
      The current ALIVE gate assessment relies on file counts asserted in Markdown documents rather
      than on CI-logged outputs of the verification bash script, meaning an auditor must re-run the
      script to independently confirm the counts rather than examining a stored script output artifact.
    claim_type: AUTHOR_THESIS
    source_files:
      - /Users/sac/process-intelligence/checkpoints/RESEARCH_CRITERIA.md
    evidence_summary: >
      The TeX file explicitly marks this as [AUTHOR THESIS]; RESEARCH_CRITERIA.md defines the
      verification script but no stored script output receipt is listed in the known receipts_found
      evidence, confirming this structural gap.
    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-CHECKPOINTS-011
    claim: >
      Quality gates verifying that each doctrine file cites at least one primary source will require
      a different mechanism than simple count checks — potentially a separate audit workflow that
      samples doctrine files and checks citation presence.
    claim_type: INTERPRETATION
    source_files:
      - /Users/sac/process-intelligence/checkpoints/RESEARCH_CRITERIA.md
    evidence_summary: >
      The TeX file marks this as [INTERPRETATION]; RESEARCH_CRITERIA.md lists source citation as an
      ALIVE requirement but the verification script does not check it programmatically, making the
      proposed audit mechanism a reasonable inference rather than a documented plan.
    confidence: MEDIUM
    allowed_in_pdf: true

