slug: checkpoints
claims:
  - id: CLM-CHECKPOINTS-001
    claim: >
      The checkpoint ledger operates under a no-forced-ALIVE rule: a verdict of ALIVE may only be
      sealed when all enumerated gate criteria are simultaneously met; a single unmet threshold
      produces a PARTIAL verdict.
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/checkpoints/RESEARCH_CRITERIA.md
      - /Users/sac/process-intelligence/checkpoints/ALIVE_GATE_ASSESSMENT.md
      - /Users/sac/process-intelligence/checkpoints/PROCESS_INTELLIGENCE_ALIVE_001.md
    evidence_summary: >
      ALIVE_GATE_ASSESSMENT.md documents all 12 gate criteria as simultaneously MET before sealing,
      and PI_RESEARCH_PROGRAM_ALIVE_001 confirms Gate 12 (No Forced ALIVE Verdicts) passed with
      zero forced verdicts recorded.
    confidence: HIGH
    allowed_in_pdf: true

