  - id: CLM-OTEL_WEAVER_EXP_003_LIVE_CHECK_TO_REFUSAL-008
    claim: "EXP-003 operationalizes the complement of the Feedstock Theorem: the\
      \ ingestion gate blocks unlawful feedstock from entering the conformance court,\
      \ converting passive telemetry observation into active coordination enforcement."
    claim_type: AUTHOR_THESIS
    source_files:
      - /Users/sac/process-intelligence/otel-weaver/doctrine/otel-weaver-is-feedstock.md
      - /Users/sac/process-intelligence/otel-weaver/experiments/exp-003-live-check-to-refusal/src/validator.rs
    evidence_summary: "The doctrine file establishes that telemetry collectors do\
      \ not block unlawful transitions; the thesis claims EXP-003's gate does exactly\
      \ that, which is an analytical conclusion the author applies to the verified\
      \ source code."
    confidence: HIGH
    allowed_in_pdf: true

