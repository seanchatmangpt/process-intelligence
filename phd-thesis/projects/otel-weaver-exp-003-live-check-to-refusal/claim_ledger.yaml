slug: otel_weaver_exp_003_live_check_to_refusal
claims:
  - id: CLM-OTEL_WEAVER_EXP_003_LIVE_CHECK_TO_REFUSAL-001
    claim: "EXP-003 implements a type-level gate function with signature `validate_and_project:\
      \ Feedstock -> Result<Admission<T,W>, Refusal>` in src/validator.rs; unverified\
      \ feedstock cannot be cast to Admission because no such conversion exists in\
      \ the type lattice — enforced at compile-time by Rust's ownership model."
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/otel-weaver/experiments/exp-003-live-check-to-refusal/src/validator.rs
      - /Users/sac/process-intelligence/otel-weaver/experiments/exp-003-live-check-to-refusal/Cargo.toml
    evidence_summary: "validator.rs defines all types and the validate_and_project\
      \ function exactly as described; Admission<T,W> has no public constructor other\
      \ than the gate function, confirmed by direct source inspection."
    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-OTEL_WEAVER_EXP_003_LIVE_CHECK_TO_REFUSAL-002
    claim: "The inline unit tests test_successful_admission and test_refusal_missing_id\
      \ pass within the standalone validator.rs, but the standalone build_refusal\
      \ uses a mock digest (format!(\"{:064x}\", raw_str.len())) rather than a genuine\
      \ BLAKE3 invocation — despite blake3 1.3 being declared as a Cargo dependency."
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/otel-weaver/experiments/exp-003-live-check-to-refusal/src/validator.rs
      - /Users/sac/process-intelligence/otel-weaver/experiments/exp-003-live-check-to-refusal/Cargo.toml
    evidence_summary: "Source inspection of validator.rs line 99 confirms the mock\
      \ hash format with comment 'Generate simulated BLAKE3 digest'; the inline tests\
      \ do not assert on the blake3_digest field and therefore cannot detect this\
      \ gap."
    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-OTEL_WEAVER_EXP_003_LIVE_CHECK_TO_REFUSAL-003
    claim: "The integration test test_weaver_integration_synthesis in weaver_integration_tests.rs\
      \ exercises five cases (nominal admission plus all four RefusalCode variants)\
      \ and asserts blake3_digest.len() == 64 using the genuine wasm4pm::crypto::Blake3\
      \ hasher, confirming real cryptographic digest production for each refusal."
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/sources/wasm4pm/tests/weaver_integration_tests.rs
      - /Users/sac/process-intelligence/otel-weaver/checkpoints/GGEN_OTEL_WEAVER_PI_RUNTIME_001.md
    evidence_summary: "Direct source inspection of weaver_integration_tests.rs confirms\
      \ five assertion blocks, each calling wasm4pm::crypto::Blake3 in build_refusal,\
      \ and the checkpoint records 'test test_weaver_integration_synthesis ... ok'\
      \ with SHA-256 seal 86ef45b3..."
    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-OTEL_WEAVER_EXP_003_LIVE_CHECK_TO_REFUSAL-004
    claim: "Two of the six named laws in live-check-finding-to-refusal-map.yaml (DanglingEventObjectLink\
      \ and SchemaVersionMismatch) have no corresponding RefusalCode variant in the\
      \ Rust implementation and no test; two more (EmptyTrace and InvalidTimestampOrder)\
      \ also lack dedicated Rust variants, making four of six named laws unimplemented."
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/otel-weaver/mappings/live-check-finding-to-refusal-map.yaml
      - /Users/sac/process-intelligence/otel-weaver/experiments/exp-003-live-check-to-refusal/src/validator.rs
    evidence_summary: "The YAML mapping defines six named laws; validator.rs RefusalCode\
      \ enum contains only four variants (MissingInstanceId, MissingActivityName,\
      \ MissingWitnessId, InvalidWitnessSignature), confirmed by direct source inspection\
      \ of both files."
    confidence: HIGH
    allowed_in_pdf: true

