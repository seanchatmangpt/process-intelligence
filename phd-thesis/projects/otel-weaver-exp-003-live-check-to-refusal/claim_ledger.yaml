      \ from Admission to the measure operator or to capital-flow settlement types\
      \ has been manufactured in the current codebase."
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/otel-weaver/checkpoints/GGEN_OTEL_WEAVER_PI_ALIVE_001.md
      - /Users/sac/process-intelligence/otel-weaver/experiments/exp-003-live-check-to-refusal/src/validator.rs
    evidence_summary: "validator.rs contains no trait bounds or type aliases connecting\
      \ Admission to mu or settlement types; the TeX explicitly marks this as documentation-level\
