  - id: CLM-OTEL_WEAVER_EXP_004_REGISTRY_TO_WITNESS-005
    claim: >-
      The generator's stated compilation command (rustc --crate-type bin -O codegen/generator.rs
      --edition 2021) is architecturally incomplete because generator.rs uses serde and serde_json
      via use declarations that cannot be resolved by bare rustc without a Cargo workspace context.
      No Cargo.toml exists in the EXP-004 directory.
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/otel-weaver/experiments/exp-004-registry-to-wasm4pm-compat-witness/README.md
      - /Users/sac/process-intelligence/otel-weaver/experiments/exp-004-registry-to-wasm4pm-compat-witness/codegen/generator.rs
      - /Users/sac/process-intelligence/phd-thesis/projects/otel-weaver-exp-004-registry-to-witness/project_manifest.yaml
    evidence_summary: >-
      generator.rs is confirmed to contain 'use serde::{Deserialize, Serialize}' and
      'use serde_json' at the top level; README.md contains the rustc compilation command;
      no Cargo.toml file was found in the experiment directory.
    confidence: HIGH
    allowed_in_pdf: true

