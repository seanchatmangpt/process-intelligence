    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-OTEL_WEAVER_EXP_004_REGISTRY_TO_WITNESS-012
    claim: >-
      The Lattice join() semantics — returning top() for any two distinct non-empty witnesses —
      may incorrectly classify valid concurrent execution paths as contradictions if the domain
      assumption that any two distinct non-empty witnesses are by definition incompatible does not
      hold for parallel process fragments.
    claim_type: AUTHOR_THESIS
    source_files:
      - /Users/sac/process-intelligence/otel-weaver/experiments/exp-004-registry-to-wasm4pm-compat-witness/src/generated_witnesses.rs
      - /Users/sac/process-intelligence/phd-thesis/projects/otel-weaver-exp-004-registry-to-witness/07_open_questions_and_next_work.tex
    evidence_summary: >-
      The join() implementation is confirmed in generated_witnesses.rs; the open questions chapter
      explicitly identifies this as Risk 1 and acknowledges the unresolved theoretical question
      about concurrent-path vs. contradictory witnesses — this is the author's analytical risk
      assessment, not a verified finding.
    confidence: HIGH
    allowed_in_pdf: true

