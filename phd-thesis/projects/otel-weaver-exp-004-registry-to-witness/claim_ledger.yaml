  - id: CLM-OTEL_WEAVER_EXP_004_REGISTRY_TO_WITNESS-001
    claim: >-
      The EXP-004 generator (codegen/generator.rs) is a Rust-based code generation pipeline that
      reads a resolved OTel Weaver convention registry, filters on the process.pi.activity group,
      and materializes type-safe ActivityWitness structs implementing the Lattice trait with
      BLAKE3-sealed witness fields.
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/otel-weaver/experiments/exp-004-registry-to-wasm4pm-compat-witness/README.md
      - /Users/sac/process-intelligence/otel-weaver/experiments/exp-004-registry-to-wasm4pm-compat-witness/codegen/generator.rs
      - /Users/sac/process-intelligence/otel-weaver/experiments/exp-004-registry-to-wasm4pm-compat-witness/src/generated_witnesses.rs
    evidence_summary: >-
      generator.rs is confirmed present and contains exactly the described serde-derived parsing
      structs, group filtering on process.pi.activity, and Lattice trait materialization;
      generated_witnesses.rs exists on disk matching the README specification.
    confidence: HIGH
    allowed_in_pdf: true

