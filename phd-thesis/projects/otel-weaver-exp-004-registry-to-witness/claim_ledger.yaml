  - id: CLM-OTEL_WEAVER_EXP_004_REGISTRY_TO_WITNESS-008
    claim: >-
      The Lattice trait implementation for ActivityWitness defines a partial order where an empty
      witness_hash is the lattice bottom (no evidence), a non-empty 64-character BLAKE3 hex string
      is the lattice top (sealed evidence), and two distinct non-empty witness_hash values return
      None from partial_cmp (incomparable), with join() returning Lattice::top() to signal
      contradiction.
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/otel-weaver/experiments/exp-004-registry-to-wasm4pm-compat-witness/src/generated_witnesses.rs
      - /Users/sac/process-intelligence/otel-weaver/experiments/exp-004-registry-to-wasm4pm-compat-witness/codegen/generator.rs
    evidence_summary: >-
      Both files were directly read and confirmed to contain the exact partial_cmp logic described
      and join() returning Self::top() on conflict via the inline comment
      'Conflict resolution: return top to represent contradiction'.
    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-OTEL_WEAVER_EXP_004_REGISTRY_TO_WITNESS-009
    claim: >-
      The top() element for ActivityWitness is implemented as "f".repeat(64), a convention chosen
      by the generator author to represent the maximal BLAKE3 hex value, not derived from any
      formal specification, and its soundness as a lattice top for the process-mining domain
      requires formal justification.
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/otel-weaver/experiments/exp-004-registry-to-wasm4pm-compat-witness/src/generated_witnesses.rs
      - /Users/sac/process-intelligence/otel-weaver/experiments/exp-004-registry-to-wasm4pm-compat-witness/codegen/generator.rs
    evidence_summary: >-
      Both files were read and confirm top() returns witness_hash: "f".repeat(64); the TeX files
      acknowledge this is an author-chosen convention with no external specification anchor.
    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-OTEL_WEAVER_EXP_004_REGISTRY_TO_WITNESS-010
    claim: >-
      EXP-004 contributes to the manufacturing architecture thesis by demonstrating that
      ggen-style manufacturing can reach the lowest level of the wasm4pm architecture — the Rust
      type definitions at the court boundary — shifting the epistemological weight so the type
      system enforces fidelity between the convention registry and the court boundary rather than
      relying on human developer vigilance.
    claim_type: AUTHOR_THESIS
    source_files:
      - /Users/sac/process-intelligence/otel-weaver/experiments/exp-004-registry-to-wasm4pm-compat-witness/README.md
      - /Users/sac/process-intelligence/otel-weaver/checkpoints/GGEN_OTEL_WEAVER_PI_ALIVE_001.md
      - /Users/sac/process-intelligence/phd-thesis/projects/otel-weaver-exp-004-registry-to-witness/project_manifest.yaml
    evidence_summary: >-
      The generator and generated artifact confirm codegen-to-type-court operation, but the
      broader architectural significance (shift in epistemological weight, ggen manufacturing
      hierarchy) is the author's analytical framing of the experiment's contribution, not a
      directly verifiable artifact claim.
    confidence: MEDIUM
    allowed_in_pdf: true

  - id: CLM-OTEL_WEAVER_EXP_004_REGISTRY_TO_WITNESS-011
    claim: >-
      The connection between EXP-004 and capital-flow settlement authorization — that a sealed
