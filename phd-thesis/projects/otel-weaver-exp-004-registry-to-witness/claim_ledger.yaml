      - /Users/sac/process-intelligence/otel-weaver/experiments/exp-004-registry-to-wasm4pm-compat-witness/README.md
    evidence_summary: >-
      The generator.rs source was directly read and confirmed to use an inline raw string
      containing only the three named attributes; the README describes the full eight-attribute
