  - id: CLM-OTEL_WEAVER_EXP_004_REGISTRY_TO_WITNESS-015
    claim: >-
      The schema-drift propagation property — that if the convention registry changes,
      re-executing the generator causes downstream code that compiled against old witness types
      to fail at compile time rather than at runtime — is architecturally sound in principle but
      has not been verified by executing a registry change and confirming the compile error, as
      the current generator reads an inlined schema rather than the live Weaver registry output.
    claim_type: INTERPRETATION
    source_files:
      - /Users/sac/process-intelligence/otel-weaver/experiments/exp-004-registry-to-wasm4pm-compat-witness/README.md
      - /Users/sac/process-intelligence/otel-weaver/experiments/exp-004-registry-to-wasm4pm-compat-witness/codegen/generator.rs
    evidence_summary: >-
      The README asserts this property verbatim; the generator code shows the mechanism is
      structurally present; however, GAP-004-B (inlined schema instead of Weaver CLI output)
      means the end-to-end registry-to-compile-error path has not been demonstrated from a
      live Weaver CLI invocation.
    confidence: MEDIUM
    allowed_in_pdf: true
