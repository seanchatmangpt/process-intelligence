  - id: CLM-RESEARCH_OPEN_ONTOLOGIES-012
    claim: "The local class definitions in the ontology corpus are declared as aligned\
      \ with public standard vocabularies (PROV-O, SKOS, SHACL) by prefix import, but\
      \ this alignment has not been verified at the semantic level by a formal ontology\
      \ alignment tool — a known open gap."
    claim_type: AUTHOR_THESIS
    source_files:
      - /Users/sac/process-intelligence/research/pi-program/ggen/ontology/pi-program.ttl
      - /Users/sac/process-intelligence/research/pi-program/emitted/ggen-validator-recovery/open-ontologies-roundtrip-report.md
    evidence_summary: "The TeX explicitly labels this gap as AUTHOR THESIS / INTERPRETATION;\
      \ pi-program.ttl confirms the prefix imports exist, but no alignment tool output\
      \ exists in the known source files to confirm semantic subsumption."
    confidence: HIGH
    allowed_in_pdf: true

