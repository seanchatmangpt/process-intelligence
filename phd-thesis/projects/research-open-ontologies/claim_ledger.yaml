  - id: CLM-RESEARCH_OPEN_ONTOLOGIES-007
    claim: "The ontology corpus provides a formal type system grounding the admissibility\
      \ predicate of the Chatman Equation (A = mu(O*)), such that evidence A is admissible\
      \ if and only if it can be expressed as RDF triples conforming to SHACL shapes,\
      \ grounded in a named compat:WitnessMarker, and accompanied by a BLAKE3 receipt."
    claim_type: AUTHOR_THESIS
    source_files:
      - /Users/sac/process-intelligence/ggen/wasm4pm-compat.ttl
      - /Users/sac/process-intelligence/research/pi-program/ggen/ontology/pi-program.ttl
      - /Users/sac/process-intelligence/research/open-ontologies/federated/CROSS_PROJECT_DEPENDENCY_GRAPH_20260601.yaml
    evidence_summary: "The Chatman Equation and its admissibility formalization are\
      \ the author's analytical framework; the corpus components (WitnessMarkers, SHACL\
      \ shapes, BLAKE3 receipts) are confirmed by source files, but the formal equation\
      \ connecting them is the author's thesis construct."
    confidence: HIGH
    allowed_in_pdf: true

