  - id: CLM-AUDITS-010
    claim: >-
      The Petri net soundness audit verifies three WF-net invariants via DFS reachability
      — option to complete, proper completion, and no dead transitions — against van der
      Aalst (1997, 1998, 2011) and Murata (1989), with a MAX_STATES hard ceiling of 10,000
      preventing state-space explosion.
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/audits/petri_net_soundness_audit.md
    evidence_summary: >-
      petri_net_soundness_audit.md is confirmed in known tests_found evidence; the TeX
      files describe the three invariant checks, MAX_STATES ceiling, and academic
      citations consistently with the audit file scope.
    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-AUDITS-011
    claim: >-
      The 12-state autonomic lifecycle (Design through BoardProjection) is fully reachable
      from the Design state via quality gate events with no deadlock traps, as confirmed by
      the Petri net soundness audit's DFS reachability analysis.
    claim_type: INTERPRETATION
    source_files:
      - /Users/sac/process-intelligence/audits/petri_net_soundness_audit.md
    evidence_summary: >-
      The Petri net soundness audit verifies WF-net soundness properties implying
      reachability and absence of deadlocks, but the specific claim about all 12 autonomic
      lifecycle states being verified was not directly confirmed in the audit file text
      read — it is a reasonable inference from the soundness result.
    confidence: MEDIUM
    allowed_in_pdf: true

  - id: CLM-AUDITS-012
    claim: >-
      A formal audit precedence protocol is required to resolve contradictory verdicts as
      the audit corpus grows, such that a more recent audit supersedes an older one for the
      same codebase surface.
    claim_type: AUTHOR_THESIS
    source_files:
      - /Users/sac/process-intelligence/audits/telemetry_auditor_audit.md
      - /Users/sac/process-intelligence/audits/stream_director_audit.md
    evidence_summary: >-
      The telemetry/stream-director verdict conflict is documented in source files; the
      TeX text explicitly labels the precedence protocol recommendation as [AUTHOR THESIS],
      marking it as the author's analytical conclusion drawn from the observed
      contradiction.
    confidence: HIGH
    allowed_in_pdf: true

