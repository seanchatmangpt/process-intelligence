slug: audits
claims:
  - id: CLM-AUDITS-001
    claim: >-
      The audits corpus maintains five deterministic, re-executable shell audit scripts
      (run_audit_1.sh through run_audit_5.sh) whose committed receipt files record
      byte-identical, reproducible output confirming process-law conformance or violation
      at the type-law surface of wasm4pm-compat.
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/audits/run_audit_1.sh
      - /Users/sac/process-intelligence/audits/run_audit_2.sh
      - /Users/sac/process-intelligence/audits/run_audit_3.sh
      - /Users/sac/process-intelligence/audits/run_audit_4.sh
      - /Users/sac/process-intelligence/audits/run_audit_5.sh
      - /Users/sac/process-intelligence/audits/audit-no-dto-flattening.txt
      - /Users/sac/process-intelligence/audits/audit-no-tool-smuggling.txt
      - /Users/sac/process-intelligence/audits/audit-feature-isolation.txt
      - /Users/sac/process-intelligence/audits/audit-projection-receipt.txt
      - /Users/sac/process-intelligence/audits/audit-graduation-boundary.txt
    evidence_summary: >-
      All five shell scripts and their paired receipt text files exist in the audits
      directory; audit-no-dto-flattening.txt contains a confirmed FAIL result proving
      deterministic output is committed as declared.
    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-AUDITS-002
    claim: >-
      Audit 1 (no DTO flattening) returns FAIL due to a DTO_001 violation: two method
      names in wasm4pm-compat — to_json_string() at compat/src/manufacturing/mod.rs:735
      and receipt_json() at compat/src/manufacturing/traits.rs:34 — violate the _json
      suffix prohibition. Audits 2–5 all return PASS. The corpus status is PARTIAL, not
      ALIVE.
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/audits/audit-no-dto-flattening.txt
      - /Users/sac/process-intelligence/audits/CONFORMANCE_REPORT.md
      - /Users/sac/process-intelligence/audits/VAN_DER_AALST_AUDIT_SUMMARY.txt
      - /Users/sac/process-intelligence/audits/AUDIT_LOG.yaml
    evidence_summary: >-
      The audit-no-dto-flattening.txt receipt confirms RESULT: FAIL, and the actual
      source lines to_json_string() (mod.rs:735) and receipt_json() (traits.rs:34) were
      verified to exist in the wasm4pm-compat codebase.
    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-AUDITS-003
    claim: >-
      The forensic audit verdict confirms 84 total tests passing across three crates with
      zero stubs, mocks, hardcoded outputs, or pre-populated result artifacts: 54 tests in
      sources/wasm4pm (23 unit + 10 e2e + 21 integration), 7 in blue_river_dam, and 23 in
      sources/wasm4pm-compat.
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/audits/forensic_audit_verdict.md
    evidence_summary: >-
      forensic_audit_verdict.md lists all 84 tests with exact crate breakdown, a PASS
      verdict for stub/mock/hardcoded detection, and cargo test output showing 54 passed /
      7 passed / 23 passed with zero failures.
    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-AUDITS-004
    claim: >-
      The compile-fail fixture corpus contains 199 fixtures with 97.7% valid law-proving
      error code coverage (292 of 299 error occurrences) and zero E0425 defects, making
      every fixture a plausible type-law receipt rather than an absence-proof false
      positive.
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/audits/AUDIT_FIXTURE_QUALITY.md
      - /Users/sac/process-intelligence/audits/AUDIT_TYPE_LAW_QUALITY.md
    evidence_summary: >-
      AUDIT_FIXTURE_QUALITY.md states 199 fixtures with 97.7% valid law-proving coverage
      and zero E0425 fixtures, confirmed by the grep command output shown in the document
      returning count of 0.
    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-AUDITS-005
    claim: >-
      The ALIVE_001 adversarial audit certifies the research foundry with 567 commits
      across all 12 corpus directories meeting minimum document count thresholds, signed
      with BLAKE3(567_commits_15_dirs) + Ed25519(teamwork_preview_worker_m5_1), with
      genesis block SHA-256:
      787985dd49ff98f9803851093406bdfc2eb7ab5f71b374d01d5b9a0ea952fc26.
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/audits/adversarial_audit_v30.1.1.md
    evidence_summary: >-
      adversarial_audit_v30.1.1.md contains all ALIVE_001 gate criteria, the 567 commit
      count, the BLAKE3 monotonic checksum, the Ed25519 signature, and the final verdict
      'ALIVE_001 - ALL CRITERIA MET.'
