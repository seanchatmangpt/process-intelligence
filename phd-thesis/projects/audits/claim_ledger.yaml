      — leaving rebranding status unresolved as of 2026-06-01.
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/audits/rebranding_ontology_audit.md
      - /Users/sac/process-intelligence/audits/rebranding_root_config_audit.md
      - /Users/sac/process-intelligence/audits/rebranding_rules_manifests_audit.md
      - /Users/sac/process-intelligence/audits/rebranding_template_audit.md
    evidence_summary: >-
      Four rebranding audit files exist in the audits directory confirming the audit ran;
      the TeX file annotates the unresolved status as [AUTHOR THESIS: the rebranding
      status is unresolved as of 2026-06-01], consistent with audit findings lacking a
      remediation receipt.
    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-AUDITS-014
    claim: >-
      The audits corpus demonstrates that quality enforcement requires coordination
      (deterministic audit execution with committed receipts) rather than prediction
      (inference from historical pass rates), because the DTO_001 violation is
      undetectable by behavioral testing but detectable by type-law pattern audit.
    claim_type: AUTHOR_THESIS
    source_files:
      - /Users/sac/process-intelligence/audits/audit-no-dto-flattening.txt
      - /Users/sac/process-intelligence/audits/forensic_audit_verdict.md
      - /Users/sac/process-intelligence/audits/CONFORMANCE_REPORT.md
    evidence_summary: >-
      The forensic audit confirms 84 tests pass (behavioral suite green) while the DTO
      audit simultaneously returns FAIL, providing concrete evidence for the author's
      coordination-vs-prediction argument; the analytical conclusion is the author's thesis
      framing of this empirical fact.
    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-AUDITS-015
    claim: >-
      The PROCESS_INTELLIGENCE_COMPAT_CONFORMANCE_001 checkpoint cannot be declared until
      DTO_001 remediation is applied (renaming to_json_string() to serialize_receipt() and
      receipt_json() to encode_receipt_proof()), all five audits return PASS, and the
      checkpoint file is committed — three preconditions that are unexecuted as of
      2026-06-01.
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/audits/CONFORMANCE_REPORT.md
      - /Users/sac/process-intelligence/audits/VAN_DER_AALST_AUDIT_SUMMARY.txt
      - /Users/sac/process-intelligence/audits/AUDIT_LOG.yaml
    evidence_summary: >-
      The DTO_001 violation is verified in source (mod.rs:735 and traits.rs:34), Audit 1
      receipt shows FAIL, and no COMPAT_CONFORMANCE_001 checkpoint file exists in the
      audits directory, confirming the deferred gate status is accurately represented.
    confidence: HIGH
    allowed_in_pdf: true
