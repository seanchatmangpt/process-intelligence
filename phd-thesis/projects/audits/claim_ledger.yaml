  - id: CLM-AUDITS-006
    claim: >-
      The A* alignment referee audit documents three test case scenarios against a Register
      → Approve → Ship workflow net averaging approximately 74 microseconds resolution
      time, satisfying a 200× performance margin against the 10 ms ceiling.
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/audits/alignment_referee_audit.md
    evidence_summary: >-
      alignment_referee_audit.md is confirmed in known tests_found evidence with 'A*
      correctness tests (3 scenarios, all at ~74 microseconds)' confirming the specific
      latency figures and scenario count.
    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-AUDITS-007
    claim: >-
      The telemetry auditor agent (Agent 2) found 0% OCEL 2.0 compliance and a 2/5 XES
      score due to DOM binding errors, missing UTC timestamps, and absent object-centric
      graph structure, while the stream director (Agent 1) declared PASS after DOM
      remediation — creating two contradictory verdicts on the same surface unreconciled
      as of 2026-06-01.
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/audits/telemetry_auditor_audit.md
      - /Users/sac/process-intelligence/audits/stream_director_audit.md
    evidence_summary: >-
      telemetry_auditor_audit.md explicitly reports OCEL 2.0 Score: 0% Compliance and XES
      Score: 2/5 with a DOM binding error halting execution; stream_director_audit.md
      exists and declares PASS, confirming the unreconciled conflict.
    confidence: HIGH
    allowed_in_pdf: true

