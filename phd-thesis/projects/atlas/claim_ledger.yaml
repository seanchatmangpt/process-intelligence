      ZoeApp Ministry Ontology applies L to a ministry domain.
    claim_type: AUTHOR_THESIS
    source_files:
      - /Users/sac/process-intelligence/doctrine/PROCESS_INTELLIGENCE_SPR_THESIS.md
      - /Users/sac/process-intelligence/phd-thesis/projects/atlas/02_lineage_and_context.tex
      - /Users/sac/process-intelligence/phd-thesis/projects/atlas/06_contribution_to_thesis.tex
    evidence_summary: >
      The SPR thesis defines the formal operators mu, alpha, rho, kappa; the mapping
      of each atlas module to specific operators is the author's analytical conclusion
      in the TeX files and not directly stated in the individual atlas source files.
    confidence: HIGH
    allowed_in_pdf: true

