      it maps modules whose receipts live in other repositories, and its own receipt
      would be redundant with rather than additive to the PI_RESEARCH_PROGRAM_ALIVE_001
      checkpoint that seals the foundry as a whole.
    claim_type: AUTHOR_THESIS
    source_files:
      - /Users/sac/process-intelligence/phd-thesis/projects/atlas/01_research_question.tex
      - /Users/sac/process-intelligence/phd-thesis/projects/atlas/05_evidence_receipts_and_gates.tex
    evidence_summary: >
      This is the author's explicit normative position, marked [AUTHOR THESIS] in the
      TeX source (01_research_question.tex), arguing that a navigational surface
      inherits rather than independently certifies ALIVE status.
    confidence: HIGH
    allowed_in_pdf: true

