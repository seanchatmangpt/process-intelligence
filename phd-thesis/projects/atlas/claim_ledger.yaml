    source_files:
      - /Users/sac/process-intelligence/phd-thesis/projects/atlas/00_project_identity.tex
      - /Users/sac/process-intelligence/phd-thesis/projects/atlas/05_evidence_receipts_and_gates.tex
      - /Users/sac/process-intelligence/AALST_CERTIFIED_ALIVE.md
    evidence_summary: >
      The TeX files explicitly state PARTIAL status with absence of internal receipt;
      AALST_CERTIFIED_ALIVE.md confirms the foundry seal exists (SHA-256
      ea15dda11d3430960ac225d43c4023ab4030663f08317c77330c32ff8ef843c6),
      though the PI_RESEARCH_PROGRAM_ALIVE_001 checkpoint file was not directly read
      to confirm the exact 12/12 gate count and 342 artifact count.
    confidence: MEDIUM
    allowed_in_pdf: true

