      located at /Users/sac/process-intelligence/atlas/, authored on 2026-06-01, with
      no subdirectories, no build artifacts, and no internal receipt chain.
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/atlas/aalst_livestream_standards.md
      - /Users/sac/process-intelligence/atlas/agi_adversarial_defenses.md
      - /Users/sac/process-intelligence/atlas/doctrine_blue_river_dam.md
      - /Users/sac/process-intelligence/atlas/ggen_prompt_manufactory.md
      - /Users/sac/process-intelligence/atlas/supabase_law_substrate.md
      - /Users/sac/process-intelligence/atlas/wasm_boundary_law.md
