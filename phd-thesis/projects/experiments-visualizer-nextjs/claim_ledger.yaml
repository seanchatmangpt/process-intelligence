    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-EXPERIMENTS_VISUALIZER_NEXTJS-006
    claim: >-
      The CSS class algebra for the three A* alignment move types (sync, log, model) is
      isomorphic to the three lawful move types in A* process alignment, making it
      structurally impossible to render an alignment block with an unlawful or missing
      move type.
    claim_type: AUTHOR_THESIS
    source_files:
      - /Users/sac/process-intelligence/experiments/visualizer-nextjs/src/app/globals.css
    evidence_summary: >-
      globals.css defines exactly three alignment-block modifier classes (.sync, .log,
      .model) with no fourth class; the thesis that this exhaustive enumeration enforces
      structural conformance at the UI layer is an authorial interpretation of the
      CSS class design.
    confidence: MEDIUM
    allowed_in_pdf: true

  - id: CLM-EXPERIMENTS_VISUALIZER_NEXTJS-007
    claim: >-
      The AGENTS.md file warns that Next.js 16 contains breaking changes relative to prior
      training data and instructs any authoring agent to read node_modules/next/dist/docs/
      before writing any code, implying the project was designed for agentic authorship that
      was anticipated but not executed.
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/experiments/visualizer-nextjs/AGENTS.md
    evidence_summary: >-
      AGENTS.md text reads 'This version has breaking changes — APIs, conventions, and file
      structure may all differ from your training data. Read the relevant guide in
      node_modules/next/dist/docs/ before writing any code.' The inference that authorship
      was anticipated but not executed is grounded in the file's existence alongside the
      absence of any React component implementation.
    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-EXPERIMENTS_VISUALIZER_NEXTJS-008
    claim: >-
      The visualizer-nextjs project is the human-facing observation layer that sits above
      the Rust (wasm4pm) and Python (pm4py) computation cores, serving as the terminal stage
      of the evidence chain at which evidence becomes auditable by a human principal.
    claim_type: AUTHOR_THESIS
    source_files:
      - /Users/sac/process-intelligence/experiments/visualizer-nextjs/src/app/globals.css
    evidence_summary: >-
      The CSS design system encodes visual representations of Rust/Python-produced process
      artefacts, supporting this architectural framing, but the positional claim (terminal
      evidence chain stage, human-auditable endpoint) is the author's analytical thesis
      rather than anything directly stated in a source file.
    confidence: MEDIUM
    allowed_in_pdf: true

  - id: CLM-EXPERIMENTS_VISUALIZER_NEXTJS-009
    claim: >-
      The layout.tsx loads Geist and Geist Mono fonts from the Vercel font system and
      applies the globals.css design system application-wide.
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/experiments/visualizer-nextjs/src/app/layout.tsx
    evidence_summary: >-
      layout.tsx imports Geist and Geist_Mono from next/font/google and imports
