  - id: CLM-EXPERIMENTS_VISUALIZER_NEXTJS-003
    claim: >-
      The globals.css file (972 lines) encodes a complete dark-mode dashboard design system
      covering five distinct visual subsystems: Petri net SVG panel, A* alignment block
      sequence, EWMA drift-detection chart with alarm banners, cryptographic ledger explorer
      with tamper-detection UI states, and a primary dashboard grid layout with a 320-pixel
      sidebar.
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/experiments/visualizer-nextjs/src/app/globals.css
    evidence_summary: >-
      Direct inspection confirms globals.css at 972 lines with CSS classes for all five
      subsystems including .petri-place, .alignment-block.sync/log/model, .ewma-canvas,
      .alarm-banner.fired, .ledger-block-card.healthy/tampered, and .dashboard-grid with
      grid-template-columns 320px 1fr.
    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-EXPERIMENTS_VISUALIZER_NEXTJS-004
