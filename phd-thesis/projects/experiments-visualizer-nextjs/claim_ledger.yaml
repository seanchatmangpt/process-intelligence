  - id: CLM-EXPERIMENTS_VISUALIZER_NEXTJS-010
    claim: >-
      A CSS design system alone cannot constitute a visualization surface; without React
      components wired to real process-intelligence data sources, the project is a
      specification without implementation — a re-instantiation of the 2016 language-model
      lesson that appearance and evidence are not the same thing.
    claim_type: AUTHOR_THESIS
    source_files:
      - /Users/sac/process-intelligence/experiments/visualizer-nextjs/src/app/globals.css
      - /Users/sac/process-intelligence/experiments/visualizer-nextjs/src/app/page.tsx
    evidence_summary: >-
      The factual basis (CSS present, no components) is source-supported; the 2016
      language-model analogy and the philosophical claim about appearance vs. evidence are
      the author's interpretive thesis connecting the project's PARTIAL status to broader
      research lineage.
    confidence: MEDIUM
    allowed_in_pdf: true

  - id: CLM-EXPERIMENTS_VISUALIZER_NEXTJS-011
    claim: >-
      The most architecturally coherent data source for the Petri net and alignment panels
      would be a WASM-compiled wasm4pm module served from a Next.js API route, allowing the
      Rust process-intelligence core to execute in the browser without a separate backend.
    claim_type: AUTHOR_THESIS
    source_files:
      - /Users/sac/process-intelligence/experiments/visualizer-nextjs/package.json
    evidence_summary: >-
      No WASM binding or API route is implemented; this is the author's design preference
      for future data integration architecture, stated explicitly as 'AUTHOR THESIS' in the
      TeX source, with no binding to any data source having been implemented.
    confidence: MEDIUM
    allowed_in_pdf: true

