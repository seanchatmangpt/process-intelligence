      - /Users/sac/process-intelligence/experiments/visualizer-nextjs/.next/BUILD_ID
      - /Users/sac/process-intelligence/experiments/visualizer-nextjs/.next/diagnostics/build-diagnostics.json
    evidence_summary: >-
