  - id: CLM-EXPERIMENTS_VISUALIZER_NEXTJS-014
    claim: >-
      The globals.css design system does not define CSS classes for panels whose data source
      is unavailable or returns an error, meaning a panel that fails to fetch data would
      render as empty rather than as an explicit error state.
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/experiments/visualizer-nextjs/src/app/globals.css
    evidence_summary: >-
      Inspection of globals.css confirms no error-state classes (e.g., .panel-error,
      .data-unavailable) are defined; the absence is directly verifiable from the source
      file, consistent with the gap documented as GAP-VIZ-006.
    confidence: HIGH
    allowed_in_pdf: true

