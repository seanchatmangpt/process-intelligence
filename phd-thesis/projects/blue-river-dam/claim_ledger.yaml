slug: blue-river-dam
claims:
  - id: CLM-BLUE_RIVER_DAM-001
    claim: >
      Blue River Dam is a synthesized (not hand-coded) governance library manufactured
      from five formal doctrine sources via the Lifecycle Orchestrator Renderer, and its
      lib.rs contains 965 lines as of 2026-06-01.
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/blue_river_dam/src/lib.rs
      - /Users/sac/process-intelligence/blue_river_dam/GENERATION_RECEIPT.md
      - /Users/sac/process-intelligence/receipts/blue_river_generation.md
    evidence_summary: >
      wc -l on lib.rs returns exactly 965; GENERATION_RECEIPT.md documents five consumed
      input doctrine sources and explicitly states the library was "synthesized (not
      hand-coded)"; upstream receipt records the render operation.
    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-BLUE_RIVER_DAM-002
    claim: >
      The project has zero external Rust dependencies; both [dependencies] and
      [dev-dependencies] tables in Cargo.toml are empty.
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/blue_river_dam/Cargo.toml
    evidence_summary: >
      Cargo.toml read directly shows empty [dependencies] and [dev-dependencies]
      sections, confirming the entire implementation uses only the Rust standard library.
    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-BLUE_RIVER_DAM-003
    claim: >
      The library enforces zero unsafe code via #![forbid(unsafe_code)] at the module
      level, and compilation succeeded with zero warnings, as certified by GENERATION_RECEIPT.md.
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/blue_river_dam/src/lib.rs
      - /Users/sac/process-intelligence/blue_river_dam/GENERATION_RECEIPT.md
    evidence_summary: >
      Line 14 of lib.rs contains `#![forbid(unsafe_code)]`; GENERATION_RECEIPT.md
      records "Unsafe Code Scan: CLEAN" and "Compilation Status: PASS (zero errors,
      zero warnings)".
    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-BLUE_RIVER_DAM-004
    claim: >
      The lib.rs contains exactly 8 test functions: 5 certified passing at receipt time
      (test_governance_hierarchy, test_lifecycle_state_machine, test_quality_gate_soundness,
      test_conformance_metric, test_mape_k_knowledge_persistence) and 3 added post-receipt
      (test_validate_wf_net_soundness, test_compute_fitness_genuine, test_mape_k_cycle_execution).
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/blue_river_dam/src/lib.rs
      - /Users/sac/process-intelligence/blue_river_dam/GENERATION_RECEIPT.md
    evidence_summary: >
      grep of test function names in lib.rs returns all 8 named functions;
      GENERATION_RECEIPT.md certifies 5/5 passing; the 3 post-receipt functions
      are present in source but not captured in any receipt.
    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-BLUE_RIVER_DAM-005
    claim: >
      A compiled ARM64 Mach-O test binary exists at
      target/debug/deps/blue_river_dam-89f933de4cf483d1 (1,272,256 bytes, executable),
