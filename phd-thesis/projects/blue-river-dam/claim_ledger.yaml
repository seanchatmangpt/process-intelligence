  - id: CLM-BLUE_RIVER_DAM-006
    claim: >
      The project is ALIVE: two receipts exist (GENERATION_RECEIPT.md and
      receipts/blue_river_generation.md), both declaring ORCHESTRATOR_ALIVE, and the
      SUBSTRATE_COMPLETE_001 checkpoint attests Phase 6 completion.
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/blue_river_dam/GENERATION_RECEIPT.md
      - /Users/sac/process-intelligence/receipts/blue_river_generation.md
      - /Users/sac/process-intelligence/checkpoints/SUBSTRATE_COMPLETE_001.md
