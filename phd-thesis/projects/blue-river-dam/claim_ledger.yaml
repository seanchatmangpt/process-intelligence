    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-BLUE_RIVER_DAM-011
    claim: >
      Blue River Dam constitutes a coordination-first process governance model that encodes
      admissible state transitions at compile time via Rust's exhaustive enum match, making
      illegal backward transitions (e.g., Monitoring -> Design) structurally impossible
      to compile rather than detected at runtime.
    claim_type: AUTHOR_THESIS
    source_files:
      - /Users/sac/process-intelligence/blue_river_dam/src/lib.rs
      - /Users/sac/process-intelligence/blue_river_dam/GENERATION_RECEIPT.md
      - /Users/sac/process-intelligence/phd-thesis/projects/blue-river-dam/06_contribution_to_thesis.tex
    evidence_summary: >
      The transition_state() exhaustive match in lib.rs implements the enforcement
      mechanically; GENERATION_RECEIPT.md certifies typestate encoding; the
      "coordination-first" framing and its contrast with prediction-first systems is the
      author's analytical conclusion stated in 06_contribution_to_thesis.tex.
    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-BLUE_RIVER_DAM-012
    claim: >
      The authority_id string "ostar-governor" in the Governor struct programmatically
      instantiates the Chatman Equation A = mu(O*), where the manufacturing operator mu
      is realized by the render operation consuming five governance doctrine sources.
    claim_type: AUTHOR_THESIS
    source_files:
      - /Users/sac/process-intelligence/blue_river_dam/src/lib.rs
      - /Users/sac/process-intelligence/receipts/blue_river_generation.md
      - /Users/sac/process-intelligence/phd-thesis/projects/blue-river-dam/02_lineage_and_context.tex
    evidence_summary: >
      The authority_id "ostar-governor" is confirmed in lib.rs line 38; the render
      operation consuming five sources is confirmed in receipts/blue_river_generation.md;
      02_lineage_and_context.tex explicitly marks the formal proof as "[AUTHOR THESIS:
      deferred to the dissertation's methods chapter]".
    confidence: MEDIUM
    allowed_in_pdf: true

  - id: CLM-BLUE_RIVER_DAM-013
    claim: >
      The 2016 language-model lesson that "local text imitation does not conserve
      consequence" is the foundational motivation for compile-time governance as the only
      form of governance that conserves consequence, forming the lineage arc from the LM
      experiment to this artifact.
    claim_type: INTERPRETATION
    source_files:
      - /Users/sac/process-intelligence/phd-thesis/projects/blue-river-dam/02_lineage_and_context.tex
    evidence_summary: >
      02_lineage_and_context.tex states this lineage claim but also acknowledges in Gap 4
