      GENERATION_RECEIPT.md verdict is "ORCHESTRATOR_ALIVE"; upstream receipt status
      is "ORCHESTRATOR_ALIVE"; SUBSTRATE_COMPLETE_001.md records Phase 6 as complete
      with Blue River Dam operational.
    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-BLUE_RIVER_DAM-007
    claim: >
      Quality gates 1, 2, 4, and 6 return hardcoded `passes: true` values and are not
      dynamically integrated with Architect::validate_wf_net_soundness() at runtime;
      only Gate 3 dynamically computes its passes value from a fitness argument.
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/blue_river_dam/src/lib.rs
    evidence_summary: >
      Source inspection at lines 559-614 shows gate_1_soundness(), gate_2_reachability(),
      gate_4_repair_soundness(), and gate_6_decommission_receipt() all return
      `passes: true` as a hardcoded literal; Gate 3 is the only gate accepting a
      fitness parameter.
    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-BLUE_RIVER_DAM-008
    claim: >
      Executor::execute_plan() does not enforce the requires_authorization flag on
      high-risk plans; a caller can pass a Plan with requires_authorization=true without
      resolution and execution will proceed.
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/blue_river_dam/src/lib.rs
    evidence_summary: >
      The execute_plan() method body (lines 467-483) only checks plan.actions.is_empty();
      there is no check of plan.requires_authorization before proceeding to emit a
      Receipt, confirming this security gap in the source.
    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-BLUE_RIVER_DAM-009
    claim: >
      The Auditor::compute_fitness() method uses a hardcoded reference sequence [1, 2, 3]
      rather than deriving the reference from Knowledge.reference_model, making the fitness
      computation correct for test cases but not generalized to arbitrary process models.
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/blue_river_dam/src/lib.rs
      - /Users/sac/process-intelligence/phd-thesis/projects/blue-river-dam/07_open_questions_and_next_work.tex
    evidence_summary: >
      07_open_questions_and_next_work.tex explicitly documents this as Risk 1 and states
      "this is a known implementation gap"; test_compute_fitness_genuine in lib.rs
      confirms the hardcoded [1,2,3] reference behavior.
    confidence: HIGH
    allowed_in_pdf: true

