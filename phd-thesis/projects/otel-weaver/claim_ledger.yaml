  - id: CLM-OTEL_WEAVER-010
    claim: >-
      The NO_DASHBOARD_TRUTH_001 doctrine refuses treatment of observability
      dashboard output as process conformance verdicts and articulates the
      Replay Test criterion requiring independent third-party replayability
      without visualization access.
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/otel-weaver/doctrine/no-dashboard-truth.md
    evidence_summary: >-
      The doctrine file was directly read; it explicitly encodes the
      NO_DASHBOARD_TRUTH_001 constant and defines the Replay Test in
      identical terms to those cited in the TeX.
    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-OTEL_WEAVER-011
    claim: >-
      The ActivityWitness lattice join operation's soundness for pairs of
      non-empty witnesses is unspecified and has not been formally proven,
      constituting an open formal correctness question.
    claim_type: AUTHOR_THESIS
    source_files:
      - /Users/sac/process-intelligence/otel-weaver/experiments/exp-004-registry-to-wasm4pm-compat-witness/
    evidence_summary: >-
      The TeX openly acknowledges this gap and the ALIVE_001 checkpoint does
      not claim lattice soundness was verified; this is the author's honest
      analytical assessment of a known formal deficiency requiring future
      proof.
    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-OTEL_WEAVER-012
    claim: >-
      The otel-weaver ingestion layer is architecturally load-bearing within
      the Chatman foundry equation A = μ(O*): raw span data is either
      promoted to a typed activity witness or refused before reaching the
      equation's input domain, and no downstream component may consume
      telemetry without traversing the Admission<T,W> gate.
    claim_type: AUTHOR_THESIS
    source_files:
      - /Users/sac/process-intelligence/otel-weaver/doctrine/telemetry-is-not-process-evidence.md
      - /Users/sac/process-intelligence/otel-weaver/checkpoints/GGEN_OTEL_WEAVER_PI_ALIVE_001.md
    evidence_summary: >-
      The architectural role is consistently stated across doctrine and
      checkpoint files; this is the author's analytical framing of the
      ingestion layer's position within the foundry equation, supported by
      doctrine but not yet verified by end-to-end compiled execution.
    confidence: MEDIUM
    allowed_in_pdf: true

  - id: CLM-OTEL_WEAVER-013
    claim: >-
      The RUNTIME_001 checkpoint audit authority label 'Dr. Wil van der Aalst
      AGI Swarm Court' is a ggen-generated narrative construct, not an
      endorsement by the real Van der Aalst or any external academic body.
    claim_type: INTERPRETATION
    source_files:
      - /Users/sac/process-intelligence/otel-weaver/checkpoints/GGEN_OTEL_WEAVER_PI_RUNTIME_001.md
    evidence_summary: >-
      The checkpoint was manufactured by ggen; 'AGI Swarm Court' is an
      internal foundry convention label and should not be represented in the
      PDF as an external academic endorsement.
    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-OTEL_WEAVER-014
    claim: >-
      Advancing the project from PARTIAL to ALIVE requires: ggen template
      actuation producing a generated/ directory, wasm4pm-compat path
      dependency verification and compilation of exp-003, materialized cargo
      test output, direct reading and execution of weaver_integration_tests.rs
      producing a materialized artifact, and confirmation of both receipt JSON
      files on disk.
    claim_type: FUTURE_WORK
    source_files:
      - /Users/sac/process-intelligence/otel-weaver/checkpoints/GGEN_OTEL_WEAVER_PI_RUNTIME_001.md
    evidence_summary: >-
      These five conditions are stated as deferred gates in the TeX and are
      corroborated by the current filesystem state — no generated/ directory,
      no target/ directories, and no receipt JSON files exist, confirming all
      five remain incomplete.
    confidence: HIGH
    allowed_in_pdf: true
