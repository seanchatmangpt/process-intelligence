  - id: CLM-OTEL_WEAVER_EXP_002_DIFF_TO_RESIDUAL-009
    claim: >-
      OTel Weaver is a surface-structure validator that confirms field names and value types but
      cannot assert that a described activity occurred in a lawful sequence relative to other
      activities; therefore telemetry schema compliance is not a sufficient proxy for process
      conformance.
    claim_type: SOURCE_SUPPORTED
    source_files:
      - /Users/sac/process-intelligence/otel-weaver/doctrine/otel-weaver-is-feedstock.md
    evidence_summary: >-
      Doctrine file otel-weaver-is-feedstock.md (OTEL_WEAVER_FEEDSTOCK_001) states "Structural
      alignment is merely the verification that our instruments are recording within expected
      parameters. It is an engineering metric," as quoted in the TeX lineage section.
    confidence: HIGH
    allowed_in_pdf: true

  - id: CLM-OTEL_WEAVER_EXP_002_DIFF_TO_RESIDUAL-010
    claim: >-
      The Rust type system enforces the categorical law Delta_W != delta_P at compile time:
      TelemetryFeedstockS2 and TelemetryFeedstockS1 are distinct types with no implicit coercion,
      and translate() is the only lawful path between them, making category separation a build-time
      guarantee rather than a runtime convention.
    claim_type: AUTHOR_THESIS
    source_files:
      - /Users/sac/process-intelligence/otel-weaver/experiments/exp-002-weaver-diff-to-pi-residual/src/bridge.rs
    evidence_summary: >-
      The distinct struct types are present in bridge.rs; the compile-time enforcement claim is
      the author's architectural interpretation of Rust's type system semantics as applied to the
      two structs.
    confidence: HIGH
    allowed_in_pdf: true

