      - /Users/sac/process-intelligence/otel-weaver/experiments/exp-002-weaver-diff-to-pi-residual/src/bridge.rs
      - /Users/sac/process-intelligence/otel-weaver/checkpoints/GGEN_OTEL_WEAVER_PI_RUNTIME_001.md
    evidence_summary: >-
      README.md defines the mathematical framework, bridge.rs operationalizes it, and
      GGEN_OTEL_WEAVER_PI_RUNTIME_001.md confirms the S2-to-S1 translation path was verified
      at runtime.
    confidence: HIGH
    allowed_in_pdf: true

