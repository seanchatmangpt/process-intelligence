      advance the project from PARTIAL to ALIVE.
    claim_type: FUTURE_WORK
    source_files:
      - /Users/sac/process-intelligence/audits/telemetry_auditor_audit.md
    evidence_summary: >-
      The five items are enumerated in 07_open_questions_and_next_work.tex under Next Receipted
