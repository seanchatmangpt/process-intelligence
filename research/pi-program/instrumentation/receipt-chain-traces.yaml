---
# OpenTelemetry Traces for Receipt Chain System
# Authority: Van der Aalst Process Mining Constitution
# Purpose: Trace receipt creation, signature generation, and chain verification
# Generated: 2026-06-01

receipt_tracing:
  service_name: "process-intelligence-receipt-system"
  version: "1.0.0"

  # Receipt chain for PI ecosystem
  receipt_chain:

    # Root receipt: Checkpoint ALIVE verdict
    - receipt_id: "RECEIPT_001_CHECKPOINT_ALIVE"
      artifact_id: "CHECKPOINT_PROCESS_INTELLIGENCE_ALIVE_001"
      operation_type: "checkpoint_verdict"
      creation_timestamp: "2026-06-01T00:00:00Z"

      content_hash:
        algorithm: "blake3"
        hash_value: "31422cd6a051f6e5c6c2f4c0fa3b7f1a9e2d5c8b1f4a7e0d3c6b9a2e5f8c1a"
        hash_timestamp: "2026-06-01T00:00:00Z"

      signature:
        algorithm: "ed25519"
        signature_value: "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a"
        signature_timestamp: "2026-06-01T00:00:01Z"
        signer_authority: "Dr. Wil van der Aalst Commission"

      parent_receipt_id: null  # Root receipt
      receipt_chain_depth: 1

      attributes:
        checkpoint_id: "PROCESS_INTELLIGENCE_ALIVE_001"
        verdict: "ALIVE"
        gates_passed: 5
        authority: "Van der Aalst Process Mining Constitution"

      # Trace span
      span:
        span_id: "receipt.hash_content"
        span_name: "Hash Receipt Content"
        start_timestamp: "2026-06-01T00:00:00Z"
        end_timestamp: "2026-06-01T00:00:00.500Z"
        duration_ms: 500
        status: "success"

    # Secondary receipt: Doctrine generation result
    - receipt_id: "RECEIPT_002_DOCTRINE_GENERATION"
      artifact_id: "ARTIFACT_PROCESS_INTELLIGENCE_DOCTRINE_MATURITY"
      operation_type: "artifact_generation"
      creation_timestamp: "2026-06-01T01:00:00Z"

      content_hash:
        algorithm: "blake3"
        hash_value: "b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b"
        hash_timestamp: "2026-06-01T01:00:00Z"

      signature:
        algorithm: "ed25519"
        signature_value: "b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1"
        signature_timestamp: "2026-06-01T01:00:01Z"
        signer_authority: "Process Intelligence Manufacturing Authority"

      parent_receipt_id: "RECEIPT_001_CHECKPOINT_ALIVE"
      receipt_chain_depth: 2

      attributes:
        artifact_type: "markdown"
        file_path: "doctrine/process-intelligence-maturity.md"
        file_size_bytes: 15432
        generation_rule: "GEN_RULE_002_DOCTRINE_SYNTHESIS"

      span:
        span_id: "receipt.hash_content"
        span_name: "Hash Doctrine Artifact"
        start_timestamp: "2026-06-01T01:00:00Z"
        end_timestamp: "2026-06-01T01:00:00.750Z"
        duration_ms: 750
        status: "success"

    # Tertiary receipt: Audit completion
    - receipt_id: "RECEIPT_003_AUDIT_COMPLETION"
      artifact_id: "ARTIFACT_CONFORMANCE_AUDIT_REPORT"
      operation_type: "audit_completion"
      creation_timestamp: "2026-06-01T02:00:00Z"

      content_hash:
        algorithm: "blake3"
        hash_value: "c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c"
        hash_timestamp: "2026-06-01T02:00:00Z"

      signature:
        algorithm: "ed25519"
        signature_value: "c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2"
        signature_timestamp: "2026-06-01T02:00:01Z"
        signer_authority: "Process Mining Audit Authority"

      parent_receipt_id: "RECEIPT_002_DOCTRINE_GENERATION"
      receipt_chain_depth: 3

      attributes:
        audit_type: "conformance"
        fitness_score: 0.92
        precision_score: 0.88
        audit_status: "PASS"

      span:
        span_id: "receipt.hash_content"
        span_name: "Hash Audit Report"
        start_timestamp: "2026-06-01T02:00:00Z"
        end_timestamp: "2026-06-01T02:00:01Z"
        duration_ms: 1000
        status: "success"

    # Quaternary receipt: M&A claim manufacturing
    - receipt_id: "RECEIPT_004_MA_CLAIM_MANUFACTURING"
      artifact_id: "ARTIFACT_BOARD_ADMISSIBLE_CLAIMS"
      operation_type: "claim_manufacturing"
      creation_timestamp: "2026-06-01T03:00:00Z"

      content_hash:
        algorithm: "blake3"
        hash_value: "d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d"
        hash_timestamp: "2026-06-01T03:00:00Z"

      signature:
        algorithm: "ed25519"
        signature_value: "d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3"
        signature_timestamp: "2026-06-01T03:00:01Z"
        signer_authority: "M&A Claims Commission"

      parent_receipt_id: "RECEIPT_003_AUDIT_COMPLETION"
      receipt_chain_depth: 4

      attributes:
        claim_count: 12
        synergy_claims: 5
        debt_claims: 4
        operational_claims: 3
        board_admissibility: true

      span:
        span_id: "receipt.hash_content"
        span_name: "Hash M&A Claims"
        start_timestamp: "2026-06-01T03:00:00Z"
        end_timestamp: "2026-06-01T03:00:00.600Z"
        duration_ms: 600
        status: "success"

# Span definitions for receipt operations
receipt_spans:

  - span_id: "receipt.hash_content"
    activity: "Hash Receipt Content"
    span_attributes:
      content_type: "string"
      artifact_id: "string"
      hash_algorithm: "string"
      hash_value: "string"
      content_size_bytes: "int"
    duration_ms: "int"
    status: "success"

  - span_id: "receipt.sign_receipt"
    activity: "Sign Receipt with Authority Key"
    span_attributes:
      receipt_id: "string"
      content_hash: "string"
      signing_algorithm: "string"
      signer_authority: "string"
      signature_value: "string"
    duration_ms: "int"
    status: "success"

  - span_id: "receipt.emit_witness"
    activity: "Emit Receipt into Witness Chain"
    span_attributes:
      receipt_id: "string"
      parent_receipt_id: "string"
      chain_depth: "int"
      witness_timestamp: "string"
      operation_type: "string"
    duration_ms: "int"
    status: "success"

  - span_id: "receipt.verify_chain"
    activity: "Verify Receipt Chain Integrity"
    span_attributes:
      chain_length: "int"
      chain_verified: "boolean"
      failed_receipts: "array<string>"
      verification_timestamp: "string"
    duration_ms: "int"
    status: "enum:success|failure|partial"

# Object-Centric Event Log (OCEL) Mapping for Receipt Chain
ocel_mapping:

  object_types:
    - id: "receipt"
      name: "Receipt"
      attributes: ["receipt_id", "content_hash", "signature"]

    - id: "artifact"
      name: "Artifact"
      attributes: ["artifact_id", "artifact_type", "content_hash"]

    - id: "authority"
      name: "Authority"
      attributes: ["authority_name", "signature_algorithm"]

    - id: "witness_chain"
      name: "Witness Chain"
      attributes: ["chain_id", "chain_length", "root_receipt_id"]

  # Span-to-event rules
  span_to_event_rules:

    - span_id: "receipt.hash_content"
      event_activity: "receipt.hash_content"
      event_objects:
        - type: "receipt"
          qualifier: "for"
        - type: "artifact"
          qualifier: "hashes"

    - span_id: "receipt.sign_receipt"
      event_activity: "receipt.sign_receipt"
      event_objects:
        - type: "receipt"
          qualifier: "signed"
        - type: "authority"
          qualifier: "signs_by"

    - span_id: "receipt.emit_witness"
      event_activity: "receipt.emit_witness"
      event_objects:
        - type: "receipt"
          qualifier: "emitted_to"
        - type: "witness_chain"
          qualifier: "receives"

    - span_id: "receipt.verify_chain"
      event_activity: "receipt.verify_chain"
      event_objects:
        - type: "witness_chain"
          qualifier: "verified"

# Temporal constraints for receipt chain
temporal_constraints:

  - constraint_id: "hash_before_sign"
    description: "Content must be hashed before signing"
    precedence: ["receipt.hash_content", "receipt.sign_receipt"]

  - constraint_id: "sign_before_emit"
    description: "Receipt must be signed before emission into chain"
    precedence: ["receipt.sign_receipt", "receipt.emit_witness"]

  - constraint_id: "emit_before_verify"
    description: "Receipts must be emitted before chain verification"
    precedence: ["receipt.emit_witness", "receipt.verify_chain"]

  - constraint_id: "parent_before_child"
    description: "Parent receipt must exist before child receipt creation"
    parent_child_rule: "parent_receipt_exists"

  - constraint_id: "monotonic_chain_depth"
    description: "Receipt chain depth increases monotonically"
    monotonic_rule: "chain_depth_increases"

# Quality metrics for receipt chain
quality_metrics:

  - metric: "chain_completeness"
    description: "All receipts in chain are present and accounted for"
    target: 100

  - metric: "signature_validity"
    description: "All receipt signatures are valid and verifiable"
    target: 100

  - metric: "parent_chain_integrity"
    description: "All parent-child receipt links are intact"
    target: 100

  - metric: "hash_collision_resistance"
    description: "No hash collisions detected in chain"
    target: 100

  - metric: "authority_consistency"
    description: "All signing authorities are consistent and authorized"
    target: 100

  - metric: "temporal_ordering"
    description: "Receipt timestamps maintain proper ordering"
    target: 100

# Receipt validation rules
validation_rules:

  - rule_id: "RULE_001_HASH_ALGORITHM"
    description: "All receipts use BLAKE3 hashing algorithm"
    severity: "CRITICAL"

  - rule_id: "RULE_002_SIGNATURE_ALGORITHM"
    description: "All receipts use Ed25519 signing algorithm"
    severity: "CRITICAL"

  - rule_id: "RULE_003_PARENT_EXISTENCE"
    description: "Parent receipt must exist before child creation"
    severity: "CRITICAL"

  - rule_id: "RULE_004_SIGNATURE_VALIDITY"
    description: "All signatures must be cryptographically valid"
    severity: "CRITICAL"

  - rule_id: "RULE_005_TIMESTAMP_ORDERING"
    description: "Timestamps must be strictly monotonic"
    severity: "HIGH"

  - rule_id: "RULE_006_AUTHORITY_AUTHORIZATION"
    description: "Signing authority must be authorized"
    severity: "HIGH"

---
metadata:
  created: "2026-06-01T00:00:00Z"
  authority: "Process Intelligence Research Foundry"
  standard: "OpenTelemetry 1.0, OCEL 2.0"
  version: "1.0.0"
  status: "ACTIVE"
