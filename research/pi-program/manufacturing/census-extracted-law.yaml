# ==============================================================================
# ANDON GATES (Hook Policies)
# ==============================================================================

hook_policies:
  - id: HOOK_no_hand_written_prompts
    label: "No Hand-Written Program Prompts"
    mission: "Block workflow execution if a rendered prompt lacks derivedFrom source"
    trigger: "prompt emit"
    enforcement: "checks SHACL shape for pm:derivedFrom triple"

  - id: HOOK_no_invalid_ggen_extension
    label: "No Invalid .ggen Source Files"
    mission: "Block workflow if new .ggen files found in source directory"
    trigger: "file write"
    enforcement: "queries graph for blocking-status .ggen files"

  - id: HOOK_no_forced_alive
    label: "No Forced ALIVE"
    mission: "Block ALIVE verdict if any required audit gate failed"
    trigger: "checkpoint emit"
    enforcement: "validates all AuditGate status before ALIVE"

  - id: HOOK_checkpoint_must_have_partial_path
    label: "Checkpoint Must Have PARTIAL Path"
    mission: "Require checkpoint template to include both ALIVE and PARTIAL exit conditions"
    trigger: "template render"
    enforcement: "validates PARTIAL section is present and executable"

  - id: HOOK_receipt_required
    label: "Receipt Required for Artifacts"
    mission: "Every rendered artifact must have corresponding receipt entry"
    trigger: "artifact emit"
    enforcement: "creates receipt with blake3 hash and provenance"

  - id: HOOK_legacy_ggen_routed
    label: "Legacy .ggen Files Must Be Classified"
    mission: "Every .ggen file in referenced tree must have classification entry"
    trigger: "audit"
    enforcement: "scans for unclassified .ggen files"

# ==============================================================================
# CHECKPOINT VERDICTS (ALIVE/PARTIAL Definitions)
# ==============================================================================

checkpoint_verdicts:
  - id: CHECKPOINT_ALIVE
    label: "ALIVE Verdict"
    mission: "Emit when all critical gates pass and at least one end-to-end warrant path is proven"
    description: "ALIVE certifies the research program is fully operational and can render research warrants from law"
    prerequisites:
      - "All ontologies present"
      - "All queries/templates valid"
      - "End-to-end warrant proof successful"
      - "Zero new .ggen source files"
      - "All legacy .ggen classified"
      - "All audit gates pass"

  - id: CHECKPOINT_PARTIAL
    label: "PARTIAL Verdict"
    mission: "Emit when any critical gate fails or prerequisites are incomplete"
    description: "PARTIAL certifies the program structure is sound but not yet fully operational"
    fail_conditions:
      - "End-to-end warrant path not yet proven"
      - "Legacy .ggen files not yet classified"
      - "PI_RESEARCH_PROGRAM_INTEL_001 topology incomplete"
      - "One or more audit gates failed"

