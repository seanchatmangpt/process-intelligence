# Andon Gate Hook Policy Configuration
# Authority: Blue River Dam v30.1.1
# Generated: 2026-06-01T16:00:00Z
# Purpose: Enforce compliance boundaries via policy gates

apiVersion: governance/v1
kind: AndonGatePolicy
metadata:
  name: blue-river-andon-gates-001
  namespace: governance
  authority: "ostar-governor"
  version: "30.1.1"

spec:
  gates:
    - id: "andon-gate-fitness"
      label: "Conformance Fitness Gate"
      comment: "Trigger auditor containment when fitness drops below 0.85"
      gateName: "fitness-below-threshold"
      triggerCondition: "Fitness(σ, W) < 0.85"
      action: "escalate-to-auditor"
      severity: "high"
      authority: "ostar-auditor"
      requiresSignature: false
      enabled: true

    - id: "andon-gate-dead-transition"
      label: "Dead Transition Detection Gate"
      comment: "Halt execution if unreachable transition detected"
      gateName: "dead-transition-found"
      triggerCondition: "exists t ∈ T : t unreachable from M0"
      action: "halt-execution"
      severity: "critical"
      authority: "ostar-auditor"
      requiresSignature: false
      enabled: true

    - id: "andon-gate-override"
      label: "Compliance Override Gate"
      comment: "Require governor signature for override authorization"
      gateName: "compliance-override-request"
      triggerCondition: "override(trace, fitness) requested"
      action: "verify-gov-proof"
      severity: "critical"
      authority: "ostar-governor"
      requiresSignature: true
      enabled: true

    - id: "andon-gate-policy-mutation"
      label: "Policy Mutation Gate"
      comment: "Enforce HSM-signed approval for LTL policy changes"
      gateName: "policy-mutation-attempt"
      triggerCondition: "Phi_Gov → Phi'_Gov"
      action: "require-hms-signature"
      severity: "critical"
      authority: "ostar-governor"
      requiresSignature: true
      enabled: true

    - id: "andon-gate-model-swap"
      label: "Model Hot-Swap Gate"
      comment: "Verify new model soundness before activation (W → W')"
      gateName: "model-replacement-request"
      triggerCondition: "Soundness(W') AND Signature(W) unchanged"
      action: "verify-soundness-compile"
      severity: "high"
      authority: "ostar-architect"
      requiresSignature: true
      enabled: true

  execution:
    mode: "synchronous"
    evaluationOrder: "priority-cascade"
    shortCircuitOnCritical: true

  alerts:
    destination: "governance-event-stream"
    format: "json"
    includePayload: true

  signatures:
    algorithm: "BLAKE3"
    keyStore: "hsm"
    verifyOnGate: true

  compliance:
    strictMode: true
    logAllDecisions: true
    auditRetention: "90d"

  escalation:
    fitnessBelowThreshold:
      threshold: 0.85
      action: "route-to-ostar-auditor"
      retryCount: 3
      retryBackoff: "exponential"

    policyMutation:
      action: "require-gov-token"
      timeout: "5m"
      escalateTo: "ostar-governor"

    modelHotSwap:
      preScan: "verify-soundness"
      verification: "compile-check"
      rollback: "automatic-on-failure"

    deadTransition:
      action: "halt-execution"
      preserveState: true
      notifyAuditor: true

  recovery:
    rollbackSupport: true
    lastVerifiedMarkingStore: "rocksdb"
    rollbackTimeout: "30s"

  typestate:
    enforcement: "compile-time"
    compilationTarget: "wasm32-unknown-unknown"
    strictTransitionCheck: true

---
# Authority Token Configuration (GovToken)
apiVersion: governance/v1
kind: GovernmentTokenPolicy
metadata:
  name: gov-token-policy-001
  signer: "ostar-governor"

spec:
  tokenTypes:
    - name: "PolicyMutationToken"
      requiredFor: ["policy-mutation"]
      expirationTime: "1h"
      signingKeyId: "gov-hsm-primary"

    - name: "ComplianceOverrideToken"
      requiredFor: ["compliance-override"]
      expirationTime: "15m"
      signingKeyId: "gov-hsm-primary"
      requiresAuditLog: true

    - name: "LifecycleTransitionToken"
      requiredFor: ["lifecycle-promotion", "lifecycle-decommission"]
      expirationTime: "24h"
      signingKeyId: "gov-hsm-primary"

  verification:
    algorithm: "blake3-signature"
    maxClockSkew: "5m"
    validateChain: true

  hsm:
    provider: "thales-lunaHSM"
    pin: "${HSM_PIN}"
    slotId: 0

---
# Compliance Boundary Enforcement
apiVersion: governance/v1
kind: ComplianceBoundary
metadata:
  name: default-compliance-boundary-001

spec:
  fitnessThreshold:
    minimum: 0.85
    warningLevel: 0.90
    action: "escalate"

  soundnessCheck:
    enabled: true
    algorithm: "structural-analysis"
    maxComputeTime: "10s"

  pInvariantCheck:
    enabled: true
    conservationRequired: true
    checkInterval: "5m"

  ltlCompliance:
    framework: "declare"
    templates:
      - "Response(A, B)"
      - "Precedence(A, B)"
      - "Choice(A, B)"
      - "Exclusive Choice(A, B)"
    vacuousSatisfactionAllowed: false

  stateAutomata:
    compilationMode: "rust-typestate"
    vmTarget: "wasm32-unknown-unknown"
    failCompilationOnViolation: true
