# API Specification Generation Rules
[[generation.rules]]
name = "openapi-specification"
query = { file = "queries/select-api-endpoints.rq" }
template = { file = "templates/openapi-3-0-spec.yaml.tera" }
output_file = "../research/pi-program/api/manufactured/openapi-3.0-spec.yaml"
mode = "Overwrite"
description = "Generate OpenAPI 3.0 specification from API schema"

[[generation.rules]]
name = "api-authentication-specification"
query = { file = "queries/select-api-auth-rules.rq" }
template = { file = "templates/api-auth-spec.md.tera" }
output_file = "../research/pi-program/api/manufactured/auth-spec.md"
mode = "Overwrite"
description = "Generate API authentication specification"

[[generation.rules]]
name = "api-rate-limiting-configuration"
query = { file = "queries/select-rate-limit-rules.rq" }
template = { file = "templates/rate-limiter.yaml.tera" }
output_file = "../research/pi-program/api/manufactured/rate-limits.yaml"
mode = "Overwrite"
description = "Generate rate limiting configuration"

# Blue River Governance Manufacturing Rules
[[generation.rules]]
name = "mape-k-monitor-config"
query = { file = "queries/select-mape-monitors.rq" }
template = { file = "templates/autonomic-loop.tera" }
output_file = "../governance/manufactured/mape-monitor-001.yaml"
mode = "Overwrite"
description = "Manufacture MAPE-K monitor configuration from governance policy"

[[generation.rules]]
name = "andon-gate-enforcement"
query = { file = "queries/select-andon-gates.rq" }
template = { file = "templates/hook-policy.tera" }
output_file = "../governance/manufactured/andon-gates-001.yaml"
mode = "Overwrite"
description = "Manufacture andon gate enforcement policies from Blue River Dam"

[[generation.rules]]
name = "drift-detection-rules"
query = { file = "queries/select-drift-detection-rules.rq" }
template = { file = "templates/drift-watch.tera" }
output_file = "../self-repair/manufactured/drift-watch-001.sparql"
mode = "Overwrite"
description = "Manufacture drift detection SPARQL rules for autonomic self-repair"

[query]
endpoint = "in-memory"
format = "sparql-11"

[template]
engine = "tera"
base_dir = "templates"
autoescape = true
strict_variables = true

[output]
checksum_algorithm = "blake3"
receipt_format = "json"
proof_format = "cryptographic-chain"
