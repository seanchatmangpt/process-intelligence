[query]
endpoint = "in-memory"
format = "sparql-11"

[template]
engine = "tera"
base_dir = "templates"
autoescape = true
strict_variables = true

[output]
checksum_algorithm = "blake3"
receipt_format = "json"
proof_format = "cryptographic-chain"
