[project]
name = "PI_RESEARCH_PROGRAM_INTEL_001"
version = "0.1.0"
description = "Research program reconciliation and governance generation"

[[inference.rules]]
name = "normalize"
description = "Pass-through normalization for DMAIC measurement gate"
construct = "CONSTRUCT { ?s ?p ?o } WHERE { ?s ?p ?o . FILTER(false) }"
order = 1

[ontology]
source = "ontology/pi-program.ttl"
additional = [
  "ontology/project-registry.ttl",
  "ontology/checkpoint-ledger.ttl",
  "ontology/research-artifact-ledger.ttl",
  "ontology/conformance-ledger.ttl",
  "ontology/graduation-boundary.ttl",
  "ontology/forbidden-collapse-law.ttl",
  "ontology/pi-ggen-audit-law.ttl",
  "ontology/pi-ggen-checkpoint-ledger.ttl",
  "ontology/pi-ggen-generation-ledger.ttl",
  "ontology/pi-ggen-invalid-extension-ledger.ttl",
  "ontology/pi-ggen-project-registry.ttl",
  "ontology/pi-ggen-source-ledger.ttl",
  "ontology/pi-ggen-unified-run.ttl"
]

[[generation.rules]]
name = "checkpoint-ledger"
query = { file = "queries/select-all-checkpoints.rq" }
template = { file = "templates/checkpoint-ledger.md.tera" }
output_file = "../emitted/ggen-validator-remediation/checkpoint-ledger.md"
mode = "Overwrite"
description = "Render ledger of all checkpoints with receipt status"

[[generation.rules]]
name = "generation-rule-ledger"
query = { file = "queries/select-all-generation-rules.rq" }
template = { file = "templates/generation-rule-ledger.yaml.tera" }
output_file = "../emitted/ggen-validator-remediation/generation-rule-ledger.yaml"
mode = "Overwrite"
description = "Render ledger of all generation rules with execution status"

[[generation.rules]]
name = "invalid-ggen-classification"
query = { file = "queries/select-invalid-ggen-files.rq" }
template = { file = "templates/invalid-ggen-classification-ledger.md.tera" }
output_file = "../emitted/ggen-validator-remediation/invalid-ggen-classification-ledger.md"
mode = "Overwrite"
description = "Render classification ledger for legacy .ggen files"

[[generation.rules]]
name = "rendered-artifact-ledger"
query = { file = "queries/select-all-rendered-artifacts.rq" }
template = { file = "templates/rendered-artifact-ledger.yaml.tera" }
output_file = "../emitted/ggen-validator-remediation/rendered-artifact-ledger.yaml"
mode = "Overwrite"
description = "Render ledger of all rendered artifacts with source trace"

