# ggen Validator v1.0 — Health Checks Configuration
#
# This file defines:
# 1. Startup validation gates (run on deployment)
# 2. Daily health checks (run every 02:00 UTC)
# 3. Receipt verification procedures
# 4. Drift detection thresholds
# 5. Alert rules and escalation

---

## Health Check Framework

health_checks:
  version: 1.0
  schedule:
    startup: "on-deployment"
    daily: "02:00 UTC"
    weekly: "Monday 03:00 UTC"
    monthly: "1st of month 04:00 UTC"

---

## Startup Validation Gates (15 gates)

### Gate 1: Valid Tera Fixtures
startup_gates:
  - name: "valid-tera-fixtures"
    category: "syntax"
    description: "All 10 valid Tera templates render without errors"
    procedure: |
      for template in artifacts/templates/*.tera; do
        ggen render-template \
          --template "$template" \
          --test-fixture health-checks/fixtures/valid/ \
          --strict-variables true
        if [ $? -ne 0 ]; then
          echo "FAIL: $template"
          exit 1
        fi
      done
      echo "PASS: All 10 templates valid"
    expected_outcome: "All templates render successfully"
    failure_action: "escalate-to-level-2"

  - name: "invalid-tera-rejection"
    category: "negative-test"
    description: "Invalid templates are correctly rejected"
    procedure: |
      for template in health-checks/fixtures/invalid-templates/*.tera; do
        ggen render-template \
          --template "$template" \
          --test-fixture health-checks/fixtures/valid/ \
          --allow-errors false
        if [ $? -eq 0 ]; then
          echo "FAIL: Invalid template not rejected: $template"
          exit 1
        fi
      done
      echo "PASS: Invalid templates rejected correctly"
    expected_outcome: "All invalid templates rejected"
    failure_action: "escalate-to-level-3"

  - name: "active-templates-parse"
    category: "syntax"
    description: "All active templates in ggen.toml parse successfully"
    procedure: |
      ggen validate-templates \
        --config config/ggen.toml \
        --strict-variables true \
        --autoescape true
      [ $? -eq 0 ] && echo "PASS: All templates parse" || exit 1
    expected_outcome: "Template syntax valid"
    failure_action: "escalate-to-level-2"

  - name: "active-ttl-validates"
    category: "syntax"
    description: "All 14 TTL ontologies validate against Turtle spec"
    procedure: |
      find artifacts/ontology -name "*.ttl" | while read ttl; do
        ggen validate-turtle "$ttl" || {
          echo "FAIL: Invalid TTL: $ttl"
          exit 1
        }
      done
      COUNT=$(find artifacts/ontology -name "*.ttl" | wc -l)
      echo "PASS: All $COUNT TTL files valid"
    expected_outcome: "14 valid TTL files"
    failure_action: "escalate-to-level-2"

  - name: "active-rq-validates"
    category: "syntax"
    description: "All 46 SPARQL queries validate against SPARQL 1.1"
    procedure: |
      ggen validate-sparql \
        --query-dir artifacts/queries \
        --format sparql-11
      [ $? -eq 0 ] && echo "PASS: All SPARQL queries valid" || exit 1
    expected_outcome: "46 valid SPARQL queries"
    failure_action: "escalate-to-level-2"

  - name: "legacy-ggen-classified"
    category: "inventory"
    description: "Every legacy .ggen file is classified"
    procedure: |
      LEGACY=$(find . -name "*.ggen" | wc -l)
      if [ "$LEGACY" -eq 0 ]; then
        echo "PASS: No legacy .ggen files (0)"
      else
        # All legacy files must have corresponding .classified.md
        find . -name "*.ggen" | while read ggen; do
          if [ ! -f "${ggen%.ggen}.classified.md" ]; then
            echo "FAIL: Unclassified legacy file: $ggen"
            exit 1
          fi
        done
        echo "PASS: All $LEGACY legacy files classified"
      fi
    expected_outcome: "0 or all legacy files classified"
    failure_action: "escalate-to-level-3"

  - name: "no-hand-written-warrant-current"
    category: "integrity"
    description: "No hand-written warrant claimed as current (all from ggen)"
    procedure: |
      ggen verify-provenance \
        --artifact-dir artifacts/ \
        --require-ggen-generated true
      [ $? -eq 0 ] && echo "PASS: All artifacts ggen-generated" || exit 1
    expected_outcome: "All artifacts have ggen provenance"
    failure_action: "escalate-to-level-3"

  - name: "parent-checkpoints-corrected"
    category: "semantics"
    description: "Parent checkpoints use gate-based reasoning (not file/commit counts)"
    procedure: |
      ggen verify-checkpoint-semantics \
        --checkpoint-dir ../checkpoints/ \
        --require-gate-based-reasoning true
      [ $? -eq 0 ] && echo "PASS: Checkpoint semantics correct" || exit 1
    expected_outcome: "All checkpoints gate-based"
    failure_action: "escalate-to-level-3"

  - name: "at-least-one-pipeline-executed"
    category: "execution"
    description: "At least one ggen pipeline executed successfully"
    procedure: |
      RECEIPTS=$(find ../../../.ggen/receipts -name "*.json" 2>/dev/null | wc -l)
      if [ "$RECEIPTS" -ge 1 ]; then
        echo "PASS: At least one pipeline executed ($RECEIPTS receipts)"
      else
        echo "FAIL: No execution receipts found"
        exit 1
      fi
    expected_outcome: "≥1 receipt"
    failure_action: "escalate-to-level-2"

  - name: "prompt-manufactory-warrant-executed"
    category: "execution"
    description: "Prompt Manufactory warrant path proven through ggen execution"
    procedure: |
      WARRANT=$(find ../emitted -name "PI_RESEARCH_PROGRAM_INTEL_001.md" 2>/dev/null)
      if [ -n "$WARRANT" ]; then
        echo "PASS: Warrant path executed (found: $WARRANT)"
      else
        echo "FAIL: Warrant path not executed"
        exit 1
      fi
    expected_outcome: "Warrant artifact generated"
    failure_action: "escalate-to-level-2"

  - name: "receipts-emitted"
    category: "execution"
    description: "All receipts emitted with valid JSON and signatures"
    procedure: |
      find ../../../.ggen/receipts -name "*.json" | while read receipt; do
        if ! ggen verify-receipt "$receipt"; then
          echo "FAIL: Invalid receipt: $receipt"
          exit 1
        fi
      done
      COUNT=$(find ../../../.ggen/receipts -name "*.json" | wc -l)
      echo "PASS: All $COUNT receipts valid"
    expected_outcome: "Valid receipts from all executions"
    failure_action: "escalate-to-level-2"

  - name: "no-forced-alive"
    category: "semantics"
    description: "ALIVE verdicts are automated (all gates PASS), not forced"
    procedure: |
      ggen verify-verdict-automation \
        --checkpoint-dir ../checkpoints/ \
        --allow-manual-override false
      [ $? -eq 0 ] && echo "PASS: Verdicts automated" || exit 1
    expected_outcome: "All verdicts automated"
    failure_action: "escalate-to-level-3"

  - name: "no-file-count-alive"
    category: "semantics"
    description: "ALIVE verdicts don't use file-count reasoning"
    procedure: |
      ggen verify-checkpoint-reasoning \
        --checkpoint-dir ../checkpoints/ \
        --forbid-file-count-reasoning true
      [ $? -eq 0 ] && echo "PASS: No file-count reasoning" || exit 1
    expected_outcome: "File counts not used in verdicts"
    failure_action: "escalate-to-level-3"

  - name: "no-commit-count-alive"
    category: "semantics"
    description: "ALIVE verdicts don't use commit-count reasoning"
    procedure: |
      ggen verify-checkpoint-reasoning \
        --checkpoint-dir ../checkpoints/ \
        --forbid-commit-count-reasoning true
      [ $? -eq 0 ] && echo "PASS: No commit-count reasoning" || exit 1
    expected_outcome: "Commit counts not used in verdicts"
    failure_action: "escalate-to-level-3"

  - name: "open-ontologies-status-classified"
    category: "inventory"
    description: "All open ontologies (not in config) are classified as open"
    procedure: |
      ggen classify-ontologies \
        --ontology-dir artifacts/ontology/ \
        --config config/ggen.toml \
        --require-all-classified true
      [ $? -eq 0 ] && echo "PASS: All ontologies classified" || exit 1
    expected_outcome: "100% ontology classification"
    failure_action: "escalate-to-level-3"

---

## Daily Pipeline Health Checks

daily_health_checks:
  - name: "daily-pipeline-execution"
    schedule: "02:00 UTC"
    description: "Execute all 3 pipelines and verify receipts"
    procedures:
      - name: "execute-pipelines"
        command: |
          for pipeline in \
            "process-intelligence-main" \
            "pi-research-program" \
            "prompt-manufactory"
          do
            ggen run --pipeline "$pipeline" \
              --config config/ggen.toml \
              --receipt /var/lib/ggen-validator/receipts/${pipeline}-$(date +%Y%m%d-%H%M%S).json
            [ $? -eq 0 ] || exit 1
          done
          echo "All pipelines executed"
        success_threshold: 1.0
        failure_threshold: 0
        alert_on_failure: true

      - name: "verify-receipt-signatures"
        command: |
          ggen verify-receipts \
            --receipt-dir /var/lib/ggen-validator/receipts/ \
            --strict true
          [ $? -eq 0 ] && echo "All signatures valid"
        success_threshold: 1.0
        failure_threshold: 0
        alert_on_failure: true

      - name: "check-log-errors"
        command: |
          ERRORS=$(grep -c "ERROR\|CRITICAL" /var/lib/ggen-validator/logs/ggen.log)
          if [ "$ERRORS" -eq 0 ]; then
            echo "No errors in logs"
          else
            echo "WARNING: $ERRORS errors in logs"
            exit 1
          fi
        success_threshold: 1.0
        failure_threshold: 0
        alert_on_failure: true

  - name: "weekly-artifact-validation"
    schedule: "Monday 03:00 UTC"
    description: "Validate all generated artifacts for correctness"
    procedures:
      - name: "validate-artifact-structure"
        command: |
          find /var/lib/ggen-validator/artifacts -type f | while read artifact; do
            case "$artifact" in
              *.rs)  ggen validate-rust "$artifact" || exit 1 ;;
              *.tera) ggen validate-template "$artifact" || exit 1 ;;
              *.yaml) ggen validate-yaml "$artifact" || exit 1 ;;
              *.md)  [ -s "$artifact" ] || exit 1 ;;
            esac
          done
          echo "All artifacts valid"
        success_threshold: 1.0
        failure_threshold: 0
        alert_on_failure: true

  - name: "monthly-compliance-report"
    schedule: "1st of month 04:00 UTC"
    description: "Generate compliance report for auditing"
    procedures:
      - name: "generate-report"
        command: |
          ggen generate-compliance-report \
            --receipt-dir /var/lib/ggen-validator/receipts/ \
            --artifact-dir /var/lib/ggen-validator/artifacts/ \
            --output-file /var/lib/ggen-validator/compliance-$(date +%Y%m).txt
          [ -f /var/lib/ggen-validator/compliance-$(date +%Y%m).txt ] && echo "Report generated"
        success_threshold: 1.0
        failure_threshold: 0
        alert_on_failure: true

---

## Receipt Verification

receipt_verification:
  signature_algorithm: "blake3"
  hash_algorithm: "blake3"

  procedures:
    - name: "verify-receipt-json"
      description: "Receipt file is valid JSON"
      check: "jq . < receipt_file > /dev/null"

    - name: "verify-receipt-fields"
      description: "Receipt contains required fields"
      required_fields:
        - "operation_id"
        - "timestamp"
        - "generation_rules"
        - "signature"
        - "artifacts"
      check: |
        jq 'has("operation_id") and has("timestamp") and
            has("generation_rules") and has("signature") and
            has("artifacts")' receipt_file | grep -q true

    - name: "verify-receipt-signature"
      description: "Signature verifies with public key"
      check: |
        ggen verify-receipt-signature \
          --receipt receipt_file \
          --public-key config/keys/verifying.key

    - name: "verify-timestamp-format"
      description: "Timestamp is valid ISO 8601 UTC"
      check: |
        timestamp=$(jq -r '.timestamp' receipt_file)
        echo "$timestamp" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'

    - name: "verify-artifact-count"
      description: "Receipt reports correct artifact count"
      check: |
        declared_count=$(jq '.artifacts | length' receipt_file)
        actual_count=$(jq '.artifacts | length' receipt_file)
        [ "$declared_count" -eq "$actual_count" ]

---

## Drift Detection

drift_detection:
  enabled: true

  thresholds:
    # Process behavior drift
    - metric: "pipeline-execution-time"
      baseline_window: 14  # days
      alert_threshold: 2.0  # 2x baseline
      action: "warn"

    - metric: "artifact-count-change"
      baseline_window: 7  # days
      alert_threshold: 0.1  # 10% change
      action: "warn"

    - metric: "receipt-signature-failure-rate"
      baseline_window: 7  # days
      alert_threshold: 0.01  # 1% failure rate
      action: "critical"

    # Structural drift
    - metric: "ontology-triple-count"
      baseline_window: 30  # days
      alert_threshold: 0.05  # 5% change
      action: "info"

    - metric: "query-execution-time"
      baseline_window: 14  # days
      alert_threshold: 1.5  # 1.5x baseline
      action: "warn"

    - metric: "template-render-time"
      baseline_window: 14  # days
      alert_threshold: 2.0  # 2x baseline
      action: "warn"

  procedures:
    - name: "detect-pipeline-drift"
      description: "Monitor pipeline execution metrics for anomalies"
      command: |
        ggen analyze-drift \
          --metric-file /var/lib/ggen-validator/metrics.json \
          --baseline-window 14 \
          --alert-on-deviation 2.0

    - name: "detect-artifact-drift"
      description: "Monitor artifact generation for unexpected changes"
      command: |
        ggen detect-artifact-changes \
          --artifact-dir /var/lib/ggen-validator/artifacts/ \
          --previous-manifest /var/lib/ggen-validator/previous-manifest.json

    - name: "detect-receipt-drift"
      description: "Monitor receipt signatures for verification failures"
      command: |
        ggen analyze-receipt-health \
          --receipt-dir /var/lib/ggen-validator/receipts/ \
          --failure-threshold 0.01

---

## Alert Configuration

alerting:
  enabled: true

  channels:
    - type: "log"
      level: "all"
      destination: "/var/lib/ggen-validator/logs/alerts.log"

    - type: "email"
      level: "critical"
      recipients: ["pi-research@example.com"]

    - type: "slack"
      level: "warning"
      webhook_url: "${SLACK_WEBHOOK_URL}"

    - type: "pagerduty"
      level: "critical"
      integration_key: "${PAGERDUTY_KEY}"

  rules:
    - name: "startup-gate-failure"
      trigger: "any startup gate FAIL"
      severity: "critical"
      action: "alert, page, snapshot logs"

    - name: "pipeline-execution-failure"
      trigger: "pipeline run fails"
      severity: "critical"
      action: "alert, page, snapshot metrics"

    - name: "signature-verification-failure"
      trigger: "receipt signature verification fails"
      severity: "critical"
      action: "alert, page, disable artifact delivery"

    - name: "drift-detected"
      trigger: "metric exceeds threshold"
      severity: "warning"
      action: "alert, investigate, document"

    - name: "log-errors-accumulated"
      trigger: ">5 errors in 1 hour"
      severity: "warning"
      action: "alert, investigate"

---

## Escalation Procedure

escalation:
  level_1:
    name: "Health Check Failure"
    action: |
      1. Review failed health check logs
      2. Run troubleshooting diagnostics
      3. Attempt automatic remediation
    contact: "DevOps Team"
    response_time: 5_minutes

  level_2:
    name: "Syntax/Validation Error"
    action: |
      1. Validate configuration and artifacts
      2. Check for file corruption
      3. Restore from backup if needed
    contact: "ggen Validator Team"
    response_time: 15_minutes

  level_3:
    name: "Semantic/Integrity Issue"
    action: |
      1. Analyze checkpoint and gate semantics
      2. Review process law for violations
      3. Determine if rollback necessary
    contact: "Process Intelligence Research Directorate"
    response_time: 30_minutes

  level_4:
    name: "Critical Failure / Breach"
    action: |
      1. Immediately stop validator
      2. Preserve all logs and state
      3. Escalate to authority
      4. Execute rollback if necessary
    contact: "Process Intelligence Authority"
    response_time: immediate

---

## Monitoring Metrics

metrics:
  collection_interval: 60  # seconds
  retention: 90  # days

  system_metrics:
    - "cpu_usage_percent"
    - "memory_usage_mb"
    - "disk_usage_percent"
    - "process_uptime_hours"

  ggen_metrics:
    - "pipeline_execution_time_ms"
    - "query_execution_time_ms"
    - "template_render_time_ms"
    - "artifact_generation_count"
    - "receipt_signature_time_ms"
    - "cache_hit_rate_percent"

  quality_metrics:
    - "gate_pass_rate_percent"
    - "receipt_signature_success_rate"
    - "artifact_validation_success_rate"
    - "log_error_rate_per_hour"

---

## SLA Definition

sla:
  availability: 0.999  # 99.9%
  acceptable_downtime: 43.2  # seconds per day

  pipeline_latency:
    p50: 2_minutes
    p95: 4_minutes
    p99: 6_minutes

  query_accuracy: 0.999  # 99.9%

  receipt_verification:
    success_rate: 0.9995  # 99.95%

  mttr:  # Mean Time To Repair
    target: 30_minutes
    acceptable: 60_minutes

