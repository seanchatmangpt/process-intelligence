compatibility_summary:
  architectural_alignment: "HIGH"
  shared_toolchain: ["ggen v26.5.x", "Oxigraph 0.3.x", "Tera 1.x"]
  process_mining_support: "EXPLICIT (POWL ontology + OCEL 2.0)"
  manufacturing_pattern_reuse: "HIGH (Cell8 gates, BLAKE3 receipts)"
  query_template_extensibility: "UNRESTRICTED"
  ontology_extension_capacity: "36 imports limit (known constraint)"
