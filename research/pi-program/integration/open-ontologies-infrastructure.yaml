code_generation_rules:
  total_active: 40  # Primary ggen.toml
  cell8_additional: 2  # cell8-ggen.toml
  pattern: "SPARQL query → Tera template → output file"
  modes: ["Overwrite"]
  notable_rules:
    - name: "cli-cmds"
      query: "commands_aggregated.rq"
      template: "cmds.rs.tera"
      output: "src/cmds/generated.rs"
      domain: "CLI"
      note: "Aggregated one row per file"

    - name: "zoela-public-materialization"
      query: "extract-public-materializations.rq"
      template: "supabase-migration.tera"
      output: "supabase/migrations/20260519000002_zoela_admitted_tables.sql"
      domain: "ZOE LA Mobile"
      note: "PUBLIC_ANCHOR-gated admission"

    - name: "zoela-rls"
      query: "extract-odrl-policies.rq"
      template: "supabase-rls.tera"
      output: "supabase/migrations/20260519000004_zoela_admitted_rls.sql"
      domain: "ZOE LA Mobile"
      note: "ODRL → Postgres RLS"

    - name: "zoela-expo-*"
      count: 10
      domain: "ZOE LA Mobile"
      outputs:
        - "apps/mobile/package.json"
        - "apps/mobile/app.json"
        - "apps/mobile/tsconfig.json"
        - "apps/mobile/babel.config.js"
        - "apps/mobile/metro.config.js"
        - "apps/mobile/App.tsx"
        - "apps/mobile/src/lib/supabaseClient.ts"
        - "apps/mobile/scripts/verify-supabase.mjs"
        - "apps/mobile/README.md"

    - name: "ghf-*"
      count: 8
      domain: "GitHub Factory"
      output_types: ["YAML", "JSON", "Markdown"]

    - name: "truex-*"
      count: 9
      domain: "E2E Test Ecosystem"
      output_types: ["JavaScript", "YAML", "JSON", "TypeScript"]

rust_source:
  workspace: "Cargo.toml (workspace)"
  edition: "2021"
  msrv: "1.70"
  modules:
    total_count: 85
    categories:
      core_operations:
        - "graph.rs (Oxigraph integration)"
        - "shacl.rs (SHACL validation)"
        - "admission.rs (recursive gates)"
        - "receipts.rs (BLAKE3 chain)"
        - "attestation.rs (Ed25519 signing)"

      llm_translation:
        - "llm_translator.rs (Groq + DSPy)"
        - "llm_input.rs (DSPy signature construction)"

      manufacturing:
        - "manufacturing/ (IaC + Erlang/AtomVM)"
        - "swarm.rs (9-breed cognition)"
        - "subprocess.rs (subprocess management)"

      validation:
        - "enforce.rs (design pattern enforcement)"
        - "clinical.rs (clinical terminology)"

      governance:
        - "cell_ready.rs (Cell8 gate orchestration)"
        - "cell8.rs (13-gate attestation)"
        - "lineage.rs (manufacturing lineage)"
        - "drift.rs (version drift detection)"

      alignment:
        - "align.rs (cross-ontology alignment)"

      tools:
        - "cmds/ (50+ MCP tool implementations)"
        - "server.rs (JSON-RPC server)"

      utilities:
        - "cache.rs (query caching)"
        - "config.rs (configuration)"
        - "error.rs (error handling)"
        - "health_guardian.rs (health monitoring)"

  key_dependencies:
    - "oxigraph 0.3.x (RDF store)"
    - "pm4py (Python process mining via FFI)"
    - "wasm4pm (WebAssembly process mining)"
    - "DSPy (LLM orchestration)"
    - "Groq API (LLM backend)"
    - "tera (template engine)"
    - "blake3 (cryptographic hashing)"
    - "ed25519 (signature verification)"
    - "tokio (async runtime)"
    - "serde (serialization)"
    - "clap (CLI parsing)"

