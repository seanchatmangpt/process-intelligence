# Open Ontologies Infrastructure Inventory
# Structured census for PI program integration planning
# Generated: 2026-06-01

project:
  name: "open-ontologies (OntoStar)"
  version: "26.5.21"
  license: "MIT"
  github: "https://github.com/fabio-rovai/open-ontologies"
  primary_language: "Rust"
  secondary_languages:
    - TypeScript
    - SQL
    - Python (scripts)
    - Erlang
  runtime_targets:
    - Linux/macOS binary
    - WebAssembly (AtomVM)

directories:
  root: "/Users/sac/open-ontologies"
  ontologies: "ontology/"
  queries: ".specify/queries/"
  templates: ".specify/templates/"
  source_code: "src/"
  tests: "tests/"
  ggen_artifacts: ".ggen/"
  receipts: ".ggen/receipts/"

ontologies:
  total_files: 30
  format: "Turtle (TTL)"
  rdf_store: "Oxigraph 0.3.x"
  serialization: "N-Triples (.nt files)"
  files:
    - path: "ontology/cli-open-ontologies.ttl"
      type: "OWL"
      purpose: "CLI surface ontology (primary generation source)"
      classes: 50+
      properties: 30+
      individuals: 100+

    - path: "ontology/powl-process-mining.ttl"
      type: "OWL"
      purpose: "POWL discovery variants + OCEL 2.0 object types"
      classes: 3
      properties: 8+
      individuals: 12  # 8 DiscoveryVariant + 4 ConformanceDimension
      entities:
        discovery_variants:
          - DecisionGraphCyclic
          - DecisionGraphCyclicStrict
          - DecisionGraphMax
          - DecisionGraphClustering
          - DynamicClustering
          - Maximal
          - Tree
          - BruteForce
        conformance_dimensions:
          - Fitness
          - Precision
          - Generalization
          - Simplicity
      dependencies:
        - wasm4pm (via algorithm stubs)
        - pm4py (via POWL model format)

    - path: "ontology/cell8-core.ttl"
      type: "OWL"
      purpose: "Manufacturing gate definitions (A1-A13)"
      classes: 6
      properties: 12
      individuals: 13

    - path: "ontology/cell8-manufacturing.ttl"
      type: "OWL"
      purpose: "Manufacturing stage transitions"
      classes: 8
      properties: 15
      individuals: 5  # Seeded, Bred, Validated, Admitted, Released

    - path: "ontology/cell8-profile.ttl"
      type: "OWL"
      purpose: "Cell8 profile layer"
      classes: 12
      properties: 20
      codegen_trigger: "cell8-ggen/ggen.toml"

    - path: "ontology/cell8-shapes.ttl"
      type: "SHACL"
      purpose: "SHACL constraints for A1-A3 gates"

    - path: "ontology/wasm4pm-stubs.ttl"
      type: "OWL"
      purpose: "wasm4pm algorithm function signatures"
      classes: 40+
      properties: 50+

    - path: "ontology/ontostar-wasm4pm-integration.ttl"
      type: "OWL"
      purpose: "Integration bridge between OntoStar and wasm4pm"
      classes: 5
      properties: 8
      alignment_patterns:
        - owl:equivalentClass
        - owl:sameAs
        - rdfs:subClassOf

    - path: "ontology/truex-ecosystem.ttl"
      type: "OWL"
      purpose: "E2E test ecosystem model"
      classes: 35+
      properties: 45+

    - path: "ontology/portfolio-os.ttl"
      type: "OWL"
      purpose: "Portfolio operating system model"
      classes: 18
      properties: 25

    - path: "ontology/requirements.ttl"
      type: "OWL"
      purpose: "Requirements DSL for CTQ admission"
      classes: 8
      properties: 12

    - path: "ontology/profiles/zoela-supabase-materialization.ttl"
      type: "OWL"
      purpose: "ZOE LA Mobile database materialization rules"
      domain: "ZOE LA Mobile"

    - path: "ontology/profiles/zoela-supabase-rls.ttl"
      type: "OWL"
      purpose: "Row-level security policy definitions"
      domain: "ZOE LA Mobile"

    - path: "ontology/profiles/zoela-governance.ttl"
      type: "OWL"
      purpose: "Role hierarchies and governance tables"
      domain: "ZOE LA Mobile"

    - path: "ontology/profiles/zoela-expo-app.ttl"
      type: "OWL"
      purpose: "Expo mobile app manifest definitions"
      domain: "ZOE LA Mobile"

    - path: "ontology/ghf-core.ttl"
      type: "OWL"
      purpose: "GitHub Factory domain model"
      domain: "GitHub Factory"
      classes: 8

    - path: "ontology/ghf-shacl.ttl"
      type: "SHACL"
      purpose: "GitHub Factory constraints"
      domain: "GitHub Factory"

    - path: "ontology/ghf-security-policy.ttl"
      type: "OWL"
      purpose: "Branch protection and security rules"
      domain: "GitHub Factory"

    - path: "ontology/aat-live-rules.ttl"
      type: "OWL"
      purpose: "AAT live rule definitions"
      classes: 10
      properties: 16

    - path: "ontology/public-alignment.ttl"
      type: "OWL"
      purpose: "Cross-system alignment mappings"

    - path: "ontology/public-shapes.ttl"
      type: "SHACL"
      purpose: "Public interface SHACL constraints"

    - path: "ontology/attestation-shapes.ttl"
      type: "SHACL"
      purpose: "Receipt attestation constraints"

    - path: "ontology/shared-receipt-shapes.ttl"
      type: "SHACL"
      purpose: "Cross-system receipt validation"

    - path: "ontology/mcpp-proof-chain.ttl"
      type: "OWL"
      purpose: "Proof chain model"

    - path: "ontology/revops-manufacturing.ttl"
      type: "OWL"
      purpose: "RevOps test case (CodeManufactory proof)"

    - path: "ontology/thesis-manufacturing.ttl"
      type: "OWL"
      purpose: "Thesis domain manufacturing model"

    - path: "ontology/thesis-shapes.ttl"
      type: "SHACL"
      purpose: "Thesis domain constraints"

ggen_manifests:
  primary:
    path: "ggen.toml"
    version: "26.5.21"
    ontology_source: "ontology/cli-open-ontologies.ttl"
    base_uri: "https://ggen.io/onto/cli/open-ontologies/"
    imports_count: 36
    imports_limit: 36  # Pre-flight scaling constraint
    scaling_note: ">36 imports causes >10 min compile; documented bottleneck"
    inference_rules: 1
    generation_rules: 40

  cell8:
    path: "cell8-ggen/ggen.toml"
    ontology_source: "../../ontology/cell8-profile.ttl"
    output_dir: "../../src/cell8/generated/"
    generation_rules: 2
    outputs:
      - "src/cell8/generated/stations.rs"
      - "src/cell8/generated/byte_law.rs"

sparql_queries:
  total_count: 83
  format: "SPARQL 1.1 (SELECT, CONSTRUCT, ASK)"
  categories:
    cli:
      count: 5
      path: ".specify/queries/cli/"
      examples:
        - "commands_aggregated.rq"
        - "subcommands_aggregated.rq"
      pattern: "GROUP_CONCAT aggregation for CLI codegen"

    zoela:
      count: 25+
      path: ".specify/queries/zoela/"
      domain: "ZOE LA Mobile"
      subcategories:
        materialization:
          - "extract-public-materializations.rq"
          - "extract-public-materialization-columns.rq"
          - "extract-legacy-coverage.rq"
        governance:
          - "extract-governance-tables.rq"
          - "extract-odrl-policies.rq"
        forms_and_types:
          - "extract-form-fields.rq"
          - "extract-skos-enums.rq"
          - "extract-types.rq"
        expo:
          - "extract-expo-package.rq"
          - "extract-expo-app-json.rq"
          - "extract-expo-tsconfig.rq"
          - "extract-expo-runtime-config.rq"
          - "extract-verify-supabase.rq"

    ghf:
      count: 8
      path: ".specify/queries/ghf/"
      domain: "GitHub Factory"
      examples:
        - "repositories_aggregated.rq"
        - "security_policy_aggregated.rq"
        - "branch_protection_aggregated.rq"
        - "labels_aggregated.rq"

    truex:
      count: 16
      path: ".specify/queries/truex/"
      domain: "E2E Test Ecosystem"
      examples:
        - "ecosystem-master-aggregated.rq"
        - "failure-taxonomy-aggregated.rq"
        - "e2e-tests-aggregated.rq"
        - "test-obligations.rq"

    powl:
      count: 2
      path: ".specify/queries/powl/"
      examples:
        - "powl-variant-descriptions.rq"

    revops:
      count: 2
      path: ".specify/queries/revops/"
      examples:
        - "stages_aggregated.rq"

    portfolio:
      count: 2
      path: ".specify/queries/portfolio/"

    thesis:
      count: 3
      path: ".specify/queries/thesis/"

    aat_live:
      count: 4
      path: ".specify/queries/aat-live/"

    wasm4pm_stubs:
      count: 4
      path: ".specify/queries/" (root level)
      examples:
        - "extract-wasm4pm-stub-requirements.rq"
        - "extract-wasm4pm-stub-interfaces.rq"
        - "wasm4pm-types-stub.rq"
        - "wasm4pm-stub-modules.rq"
        - "wasm4pm-cognition-breeds.rq"

    cell8:
      count: 2
      path: "cell8-ggen/queries/"
      examples:
        - "manufacturing_gates.rq"
        - "byte_law_types.rq"

  query_patterns:
    aggregation: "GROUP_CONCAT for flattening nested structures → one row per output file"
    materialization: "Extract domain data (tables, columns, policies) for migration generation"
    governance: "Extract authorization rules (ODRL) for RLS policy generation"
    validation: "ASK queries to verify ontology structure compliance"

tera_templates:
  total_count: 74
  engine: "Tera 1.x"
  auto_escape: true
  strict_variables: true
  categories:
    cli:
      count: 2
      path: ".specify/templates/cli/"
      outputs: "Rust code"

    zoela:
      count: 20+
      path: ".specify/templates/zoela/"
      domain: "ZOE LA Mobile"
      output_types:
        - "SQL migrations"
        - "TypeScript types"
        - "React form hooks"
        - "Zod schemas"
        - "OCEL schemas"
        - "Expo config files"
      examples:
