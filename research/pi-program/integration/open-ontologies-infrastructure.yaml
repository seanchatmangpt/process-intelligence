receipt_chain:
  storage: ".ggen/receipts/"
  format: "JSON"
  hash_algorithm: "BLAKE3"
  signature_algorithm: "Ed25519"
  immutability: "BLAKE3-chained (previous_receipt pointer)"
  fields:
    - receipt_id
    - timestamp
    - tenant_id
    - session_id
    - gate_passed
    - input_hash
    - previous_receipt
    - signature
    - signing_key_id
    - admission_evidence
  verification_tool: "open-ontologies verify --receipt <path>"
  key_storage: ".ggen/keys/"

rdf_store:
  engine: "Oxigraph"
  version: "0.3.x"
  store_path: ".ggen/rdf-store"
  serialization:
    primary: "N-Triples (.nt files)"
    cache: "RDF store cache"
  query_caching:
    enabled: true
    ttl_seconds: 3600
    key_algorithm: "SHA256"
  inference_profiles:
    - "RDFS"
    - "OWL-RL"
  capabilities:
    - "SPARQL 1.1 SELECT, CONSTRUCT, ASK"
    - "Named graphs"
    - "Full-text search indexes"

ggen_artifacts:
  cache_directory: ".ggen/cache/"
  cache_files:
    - "inference_state.sha256"
    - "manifest.sha256"
    - "ontology.sha256"
    - "rules.sha256"
  receipt_directory: ".ggen/receipts/"
  proof_receipt_directory: ".ggen/proof-receipts/"
  audit_directory: ".ggen/audit/"
  audit_subdirectories:
    - "p0-a/ (P0-B.4d-fix audits)"

integration_patterns:
  shared_sparql_infrastructure:
    path: ".specify/queries/"
    extensibility: "New domain subdirectories can be added without modifying ggen.toml"
    constraints: []

  tera_template_expansion:
    path: ".specify/templates/"
    extensibility: "New templates for new domains"
    constraints: []

  ontology_extension:
    path: "ontology/"
    extensibility: "New TTL files can be imported into cli-open-ontologies.ttl"
    constraints:
      - "Total imports must not exceed 36 (pre-flight scaling bottleneck)"

  cell8_gate_patterns:
    reusability: "A1-A13 gate structure can be adapted for domain-specific lifecycle states"
    location: "src/cell8/ (generated) + ontology/cell8-*.ttl (source)"

  receipt_chain_extension:
    reusability: "BLAKE3 chain can be extended with domain-specific events"
    location: ".ggen/receipts/"

  ocel_object_types:
    reusability: "OCEL 2.0 object type classes from powl-process-mining.ttl"
    location: "ontology/powl-process-mining.ttl"

proposed_pi_integration_bridges:
