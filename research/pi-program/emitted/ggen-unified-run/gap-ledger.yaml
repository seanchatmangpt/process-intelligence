    affected_files:
      - "~/wasm4pm-types/src/error.rs"
      - "~/wasm4pm/src/validation/*.rs"
      - "~/wasm4pm-compat/src/admission.rs (refusal law definitions)"
    description: |
      wasm4pm returns ValidationError(String) for all validation failures.
      Covenant forbids bare String refusals; each refusal must name a specific
      structural law (e.g., DanglingEventObjectLink, MissingFinalMarking).
      String refusals carry no witness type, no law identity, no structured reason.
      This makes wasm4pm non-conformant with compat type-law covenant.
    expected_capability: |
      All error variants in wasm4pm::Error must be named refusals carrying
      Refusal<R, W> where R is a specific structural law type from compat
      and W is a witness marker. Examples: Refusal<DanglingLink, Ocel20>,
      Refusal<MissingFinalMarking, EventLog>, etc.
    observed_capability: |
      Error enum uses String variants: ValidationError(String), ParseError(String),
      ExecutionError(String), StateError(String), etc. No structured refusal type.
    evidence_sources:
      - "~/wasm4pm/crates/wasm4pm-types/src/error.rs — Error enum all String-typed"
      - "COVENANT.md § What Claims May NOT Be Made — Forbids bare String refusals"
      - "~/wasm4pm-compat/src/admission.rs — Refusal<R, W> type law defined"
    remediation_class: "ONTOLOGY_MISSING"
    allowed_change_type: "REPLACE_ERROR_ENUM, ADD_REFUSAL_TYPES, RENAME_VARIANTS"
    forbidden_change_type: "KEEP_STRING_ERRORS, IGNORE_WITNESS_TYPE, BYPASS_REFUSAL_LAW"
    audit_gate: "gate-7-named-refusal-surface-complete"
    expected_receipt: "BLAKE3(wasm4pm_named_refusal_impl_complete)"
    remediation_effort_hours: 6
    remediation_steps:
      - "Enumerate all possible validation failure reasons in wasm4pm"
      - "Create named refusal types for each (or reuse from compat if applicable)"
      - "Replace Error::ValidationError(String) with Error::ValidationFailed(Refusal<...>)"
