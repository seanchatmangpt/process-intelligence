  # Define which gaps must close before others
  closure_order:
    - phase: "IMMEDIATE (0-4 hours)"
      gaps: ["GAP_010"]  # WfNet forgeable attest
    - phase: "URGENT (4-12 hours)"
      gaps: ["GAP_004", "GAP_005", "GAP_008"]  # TTL parse, ggen legacy, DTO flattening
    - phase: "HIGH (12-24 hours)"
      gaps: ["GAP_001", "GAP_002"]  # Graduation boundary + named refusals
    - phase: "MAJOR (24-48 hours)"
      gaps: ["GAP_003"]  # Replace file-count gates with behavioral gates
    - phase: "EXPANSION (48+ hours)"
      gaps: ["GAP_006", "GAP_007", "GAP_009", "GAP_011"]  # Algorithm implementations

  prerequisite_chains:
    # GAP_001 must close before GAP_002, GAP_006, GAP_007, GAP_009, GAP_011
    # because those gaps require compat types to be imported into wasm4pm
    "GAP_001": ["GAP_002", "GAP_006", "GAP_007", "GAP_009", "GAP_011"]

    # GAP_004 must close before GAP_005
    # because TTL must parse before ggen rules can be evaluated
    "GAP_004": ["GAP_005"]

audit_paths:
  # Which audit gates correspond to which gaps
  "gate-1-no-dto-flattening": "GAP_008"
  "gate-3-ttl-graphs-parse": "GAP_004"
  "gate-6-discovery-algorithm-coverage": ["GAP_006", "GAP_011"]
  "gate-6-conformance-algorithm-coverage": "GAP_007"
  "gate-6-query-engine-coverage": "GAP_009"
  "gate-7-named-refusal-surface-complete": "GAP_002"
  "gate-8-no-forgeable-attestation": "GAP_010"
  "gate-9-compat-graduation-boundary-complete": "GAP_001"
  "gate-9-all-legacy-ggen-classified": "GAP_005"
  "gate-10-no-file-count-gates-for-alive": "GAP_003"

