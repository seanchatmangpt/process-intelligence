root_cause_analysis:
  title: "Why Previous Validator Failed"
  analysis: |
    The original validate_tera_syntax() function in
    crates/ggen-core/src/validation/syntax_validator.rs
    was a passthrough that always returned Ok(()),
    never actually validating any Tera templates.

    This is the ROOT CAUSE of gate 2 failure.

  proof: |
    Lines 148-152 of syntax_validator.rs:

    fn validate_tera_syntax(_content: &str) -> Result<()> {
        // Tera syntax validation is complex and requires a full Tera engine.
        // For now, we passthrough as Tera errors are caught at render time.
        Ok(())
    }

    The function ignores its parameter (_content) and always succeeds.

