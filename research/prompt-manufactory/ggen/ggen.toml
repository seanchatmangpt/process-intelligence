[project]
name = "prompt-manufactory"
version = "0.1.0"
description = "Post-cyberpunk layer: research warrants manufactured from law"
authors = ["Sean Chatman"]
hand_coding = false

[[inference.rules]]
name = "normalize"
description = "Pass-through normalization for DMAIC measurement gate"
construct = "CONSTRUCT { ?s ?p ?o } WHERE { ?s ?p ?o }"
order = 1

[ontology]
source = "ontology/prompt-manufactory.ttl"
additional = [
  "ontology/research-program-law.ttl",
  "ontology/workflow-law.ttl",
  "ontology/subagent-role-law.ttl",
  "ontology/skill-law.ttl",
  "ontology/hook-law.ttl",
  "ontology/checkpoint-law.ttl",
  "ontology/forbidden-collapse-law.ttl"
]
standard_only = false

[generation]
output_dir = ".."

# Prompt Manufactory Generation Rules
# Phase 8: Enable workflow, subagent, and checkpoint prompt manufacturing

[[generation.rules]]
name = "workflow-prompts"
query = { file = "queries/select-workflow-prompts.rq" }
template = { file = "templates/workflow-prompt.md.tera" }
output_file = "emitted/prompts/workflows/{{ programId }}.md"
mode = "Overwrite"
description = "Generate workflow-level prompts from research programs"

[[generation.rules]]
name = "subagent-prompts"
query = { file = "queries/select-subagent-prompts.rq" }
template = { file = "templates/subagent-prompt.md.tera" }
output_file = "emitted/prompts/subagents/{{ roleLabel }}.md"
mode = "Overwrite"
description = "Generate subagent role prompts from subagent-role-law"

[[generation.rules]]
name = "checkpoint-prompts"
query = { file = "queries/select-checkpoint-prompts.rq" }
template = { file = "templates/checkpoint-prompt.md.tera" }
output_file = "emitted/prompts/checkpoints/{{ programId }}.md"
mode = "Overwrite"
description = "Generate checkpoint-level prompts from checkpoint definitions"

# Skill prompts
[[generation.rules]]
name = "skill-prompts"
query = { file = "queries/select-skill-prompts.rq" }
template = { file = "templates/skill.md.tera" }
output_file = "emitted/prompts/skills/{{ skillId }}.md"
mode = "Overwrite"
description = "Generate skill warrants from skill-law"

# Hook policy prompts
[[generation.rules]]
name = "hook-policies"
query = { file = "queries/select-hook-policies.rq" }
template = { file = "templates/hook-policy.md.tera" }
output_file = "emitted/prompts/hooks/{{ hookId }}.md"
mode = "Overwrite"
description = "Generate hook policy documents from hook-law"

# Index rules for manufacturing receipts
[[generation.rules]]
name = "prompt-receipt-ledger"
query = { file = "queries/select-rendered-prompts.rq" }
template = { file = "templates/prompt-receipt.md.tera" }
output_file = "emitted/indexes/prompt-receipt-ledger.md"
mode = "Overwrite"
description = "Generate prompt receipt ledger for manufacturing audit"

[sync]
enabled = true
on_change = "manual"
validate_after = true
conflict_mode = "fail"

[rdf]
formats = ["turtle"]
default_format = "turtle"
strict_validation = false

[templates]
enable_caching = true
auto_reload = true

[output]
formatting = "default"
line_length = 100
indent = 4
