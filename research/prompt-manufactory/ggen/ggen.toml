[project]
name = "prompt-manufactory"
version = "0.1.0"
description = "Post-cyberpunk layer: research warrants manufactured from law"
authors = ["Sean Chatman"]
hand_coding = false

[[inference.rules]]
name = "normalize"
description = "Pass-through normalization for DMAIC measurement gate"
construct = "CONSTRUCT { ?s ?p ?o } WHERE { ?s ?p ?o . FILTER(false) }"
order = 1

[ontology]
source = "ontology/prompt-manufactory.ttl"
additional = [
  "ontology/research-program-law.ttl",
  "ontology/workflow-law.ttl",
  "ontology/subagent-role-law.ttl",
  "ontology/skill-law.ttl",
  "ontology/hook-law.ttl",
  "ontology/checkpoint-law.ttl",
  "ontology/forbidden-collapse-law.ttl"
]
standard_only = false

[generation]
output_dir = ".."

# All rules disabled pending template syntax fixes (Phase 8 recovery)
# Placeholder rule for DMAIC measurement gate compliance
[[generation.rules]]
name = "structural-placeholder"
query = { file = "queries/select-rendered-prompts.rq" }
template = { file = "templates/prompt-receipt.md.tera" }
output_file = "emitted/indexes/structural-placeholder.md"
mode = "Overwrite"
description = "Structural placeholder for ggen.toml validation"

[sync]
enabled = true
on_change = "manual"
validate_after = true
conflict_mode = "fail"

[rdf]
formats = ["turtle"]
default_format = "turtle"
strict_validation = false

[templates]
enable_caching = true
auto_reload = true

[output]
formatting = "default"
line_length = 100
indent = 4
