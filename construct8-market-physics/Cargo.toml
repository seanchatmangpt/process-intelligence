[workspace]
members = ["crates/c8-core","crates/c8-graph","crates/c8-market","crates/c8-time","crates/c8-instruments","crates/c8-adversary","crates/c8-receipts","crates/c8-bench"]
resolver = "2"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
criterion = { version = "0.5", features = ["html_reports"] }
