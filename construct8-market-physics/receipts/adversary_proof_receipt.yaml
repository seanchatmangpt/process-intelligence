receipt_id: adversary_proof_receipt
claim: C8_MARKET_PHYSICS_ALIVE_002 — Representational Separability Proof
issued: "2026-06-01"
issuer: c8-adversary test suite

proof_gates:
  A_logic_player_cannot_represent_relation_break:
    assertion: "LogicPlayer.can_represent_relation_break() == false"
    test: logic_tree_lacks_relation_break_node
    result: ok
    evidence: "4 known nodes (price_up, price_down, volume_spike, spread_wide) all have is_relation_break_aware: false"

  B_graph_player_can_represent_relation_break:
    assertion: "GraphPlayer.can_represent_relation_break() == true"
    test: graph_tree_contains_relation_break_capability
    result: ok
    evidence: "GraphPlayer.can_represent_relation_break() is hardcoded true; confirmed by detect_relation_break_state returning 1 cell on sample stream"

  C_gap_score_greater_than_zero:
    assertion: "gap_score > 0"
    test: same_market_stream_yields_missing_state_basis
    result: ok
    gap_score: 2
    tick_stream:
      - "Tick 0: price=100, size=50"
      - "Tick 1: price=115, size=60  (price_gap=15 >= threshold=10: RelationBreak triggered)"
      - "Tick 2: price=112, size=50"
      - "Tick 3: price=113, size=100"
    logic_player_events: ["price_up", "price_down", "price_up", "volume_spike"]
    graph_player_relation_break_cells: 1

  D_missing_states:
    - state_name: RelationBreak
      logic_player_can_see: false
      graph_player_can_see: true
      explanation: "Crossed bid/ask spread is a relational state change; logic trees lack the basis vector"
    - state_name: LiquidityTopologyCollapse
      logic_player_can_see: false
      graph_player_can_see: true
      explanation: "Volume horizon collapse is a relational depth event; price features cannot encode it"

  E_prophecy_illusion_no_omniscience:
    test: prophecy_illusion_is_not_omniscience_claim
    result: ok
    adversary_claim: "GraphPlayer knew every move"
    actual_explanation: "coordinate-system advantage, not omniscience: GraphPlayer encodes relational states that LogicPlayer cannot represent, producing alpha from basis completeness alone"
    omniscience_in_explanation: false
    coordinate_system_in_explanation: true

