# ============================================================================
# QUERY ENDPOINT CONFIGURATION
# ============================================================================

[query]
endpoint = "in-memory"
format = "sparql-11"
ontology_namespace = {
  ma = "https://process.intelligence/ma/",
  lifecycle = "https://process.intelligence/lifecycle/",
  wasm4pm = "https://process.intelligence/wasm4pm/",
  compat = "https://process.intelligence/compat/",
  ggen = "https://process.intelligence/ggen/",
  health = "https://process.intelligence/health/",
  arch = "https://process.intelligence/ecosystem/",
  fin = "https://process.intelligence/financial/",
  integ = "https://process.intelligence/integration/",
  census = "https://process.intelligence/census/",
  risk = "https://process.intelligence/risk/",
  conform = "https://process.intelligence/conformance/"
}

# ============================================================================
# TEMPLATE ENGINE CONFIGURATION
# ============================================================================

[template]
engine = "tera"
base_dir = "templates"
autoescape = true
strict_variables = true
filters = ["trim", "indent", "split", "sort", "group_by", "reverse", "slice", "length"]

# ============================================================================
# OUTPUT & RECEIPT CONFIGURATION
# ============================================================================

[output]
checksum_algorithm = "blake3"
receipt_format = "json"
proof_format = "cryptographic-chain"
receipt_directory = "../.ggen/receipts"

# ============================================================================
# EXECUTION POLICY
# ============================================================================

[execution]
mode = "sequential"
stop_on_error = true
dry_run = false
receipt_verification = "strict"

# All rules must execute successfully before marking phase complete
# All receipts must be signed and verified
# All templates must render without variable errors
