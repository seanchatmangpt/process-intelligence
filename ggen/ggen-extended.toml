# ggen — Governance Generation Engine (Extended Stub Replacement Rules)
# PHASE A: Stub Inventory and Rule Creation
#
# This configuration extends the base ggen.toml with generation rules to replace
# all stub/placeholder files discovered in Phases 14-21 with dynamically generated
# content from SPARQL queries and Tera templates.
#
# Authority: Process Intelligence Research Directorate
# Effective Date: 2026-06-01
# Version: 0.2.0

[project]
name = "process-intelligence-ggen-extended"
version = "0.2.0"
description = "Extended generation rules for stub replacement and research program artifact manufacturing"
evidence_sources = ["../receipts", "../checkpoints"]

[ontology]
source = "ontology-extensions.ttl"

[[inference.rules]]
name = "normalize"
description = "Pass-through normalization to satisfy DMAIC measurement gates"
construct = "CONSTRUCT { ?s ?p ?o } WHERE { ?s ?p ?o . FILTER(false) }"
order = 1

# ============================================================================
# PHASE OUTPUTS & DEPLOYMENT ARTIFACTS (Phase 14-21)
# ============================================================================

# Rule 1: Deployment Summary (Phase 14)
[[generation.rules]]
name = "render-deployment-summary"
description = "Manufacture DEPLOYMENT_SUMMARY.md from ggen validator ontology + execution traces"
query = { file = "queries/select-deployment-summary-data.rq" }
template = { file = "templates/deployment-summary.md.tera" }
output_file = "/Users/sac/process-intelligence/research/pi-program/deployment/ggen-validator-v1.0/DEPLOYMENT_SUMMARY_GENERATED.md"
mode = "Overwrite"
metadata = {
  format = "markdown",
  audience = "DevOps/SRE",
  compliance = "Van der Aalst Constitution",
  evidence_backing = "ggen execution receipts + checkpoint verdicts"
}

