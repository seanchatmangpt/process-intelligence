version: "1.0.0"
target_ecosystem: "Specta 2.x -> TypeScript"
scope: "Type projection validation rules for browser integration"

derivation_laws:
  required_traits:
    - name: "specta::Type"
      macro: "#[derive(Type)]"
      criticality: "Blocker"
      description: "Generates static type description at compile time."
    - name: "serde::Serialize"
      macro: "#[derive(Serialize)]"
      criticality: "High"
      description: "Required for wire-shape sync; mappings must match serialization outputs."
    - name: "serde::Deserialize"
      macro: "#[derive(Deserialize)]"
      criticality: "High"
      description: "Required for wire-shape sync; mappings must match deserialization inputs."

type_mappings:
  primitives:
    bool: "boolean"
    f32: "number"
    f64: "number"
    i8: "number"
    u8: "number"
    i16: "number"
    u16: "number"
    i32: "number"
    u32: "number"
    isize: "number"
    usize: "number"
    i64:
      ts_type: "number"
      alternative: "bigint"
      rules: "If bigint mode is disabled, maps to number (safety bound: +/- 2^53 - 1)."
    u64:
      ts_type: "number"
      alternative: "bigint"
      rules: "If bigint mode is disabled, maps to number (safety bound: 2^53 - 1)."
    char: "string"
    String: "string"
    str: "string"
  collections:
    Vec: "T[]"
    slice: "T[]"
    HashSet: "T[]"
    BTreeSet: "T[]"
    HashMap: "Record<K, V>"
    BTreeMap: "Record<K, V>"
  special:
    Option: "T | null"
    Unit: "null"
    Box: "T"
    Arc: "T"
    Rc: "T"

enum_tagging_rules:
  external:
    serde_attributes: []
    description: "Default Serde format where the variant name is a single key wrapping the variant value."
    ts_pattern: "export type EnumName = { VariantA: null } | { VariantB: VariantBType } | { VariantC: [Tuple1, Tuple2] }"
  internal:
    serde_attributes:
      - "tag = \"type_field\""
    description: "Variant name is placed in a specified field inside the struct. Only applies to struct variants."
    ts_pattern: "export type EnumName = { type_field: 'VariantA' } | { type_field: 'VariantB' } & VariantBFields"
  adjacent:
    serde_attributes:
      - "tag = \"type_field\""
      - "content = \"content_field\""
    description: "Variant name and the contents are placed under two separate adjacent keys."
    ts_pattern: "export type EnumName = { type_field: 'VariantA'; content_field: null } | { type_field: 'VariantB'; content_field: VariantBType }"
  untagged:
    serde_attributes:
      - "untagged"
    description: "Variants have no tag markers; TypeScript matches types purely by structure."
    ts_pattern: "export type EnumName = VariantAType | VariantBType | VariantCType"

attribute_resolution_order:
  rules:
    - "Specta-specific attributes (e.g., #[specta(rename = '...')]) override Serde-specific attributes (e.g., #[serde(rename = '...')])."
    - "Serde attributes are applied to the AST via specta-serde layer when processing for serialization."
    - "Unannotated types inherit system defaults (camelCase casing if rename_all is not set is NOT applied; keys stay snake_case unless rename_all is defined)."

field_modifiers:
  serde_rename:
    attribute: "#[serde(rename = \"new_name\")]"
    ts_output: "key becomes 'new_name'"
  serde_rename_all:
    attribute: "#[serde(rename_all = \"camelCase\")]"
    ts_output: "All keys in container convert to camelCase"
  serde_skip:
    attribute: "#[serde(skip)]"
    ts_output: "Field is omitted from TypeScript"
  serde_flatten:
    attribute: "#[serde(flatten)]"
    ts_output: "Properties of sub-struct are merged directly into the outer TypeScript type"
  specta_inline:
    attribute: "#[specta(inline)]"
    ts_output: "The type definition is embedded directly at reference site instead of importing a named reference"
  specta_optional:
    attribute: "#[specta(optional)]"
    ts_output: "Emits key as optional field 'key?: value' in TypeScript"

verification_checkpoints:
  - id: "V-001"
    name: "Derive Check"
    description: "Verify that all structs/enums in the API boundary possess #[derive(Type)] annotation."
  - id: "V-002"
    name: "Tagging Sync Check"
    description: "Ensure that front-end API clients use exactly the union types generated by the matching Tagging rules."
  - id: "V-003"
    name: "Optional Field Parity"
    description: "Confirm fields marked Option<T> or #[specta(optional)] translate to optional properties on the TypeScript boundary."
  - id: "V-004"
    name: "Generic Propagation"
    description: "Verify that generic TS interfaces are generated with matching generic parameters and do not resolve to 'any' due to missing Type bounds in Rust."
