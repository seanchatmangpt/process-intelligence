## Summary Statement

**ggen Feature Governance Law** defines 6 features controlling Cargo derives and optional dependencies in wasm4pm-compat:

1. **default**: Core compatibility; no tools
2. **ts**: Specta-based TypeScript projection for browsers
3. **wasm**: ABI-safe WebAssembly bindings with JavaScript FFI
4. **component**: WebAssembly Component Model (WIT worlds)
5. **strict**: Stricter compile-time and audit-time validation
6. **wasm4pm**: Graduation bridge to execution engine

All features follow the doctrine: **Features add derives and dependencies only. No features enable execution engines. No tool smuggling.**

Cargo feature unification applies globally; all features are tested in all combinations. Core algorithms remain correct regardless of feature enablement.

**Status: MANUFACTURED — Ready for cargo-make integration and audit enforcement.**
