## Feature Unification Effects & Warnings

unification_doctrine: "Cargo features are unified globally across the entire build graph. Enabling a feature in any downstream crate enables it for the entire workspace."

effects:
  - effect_id: "workspace_unification"
    trigger: "Enabling 'ts' or 'wasm' in any workspace member"
    consequence:
      - "All workspace members inherit tsify, wasm-bindgen, specta, serde dependencies"
      - "All crates must remain correct under feature-enabled builds"
      - "Core algorithms cannot depend on feature enablement (must stay correct for all combinations)"
    mitigation:
      - "Use #[cfg(feature = '...')] to guard feature-dependent code strictly"
      - "Test core algorithms with all feature combinations (via matrix CI)"
      - "Maintain invariant: features add only serialization, never change logic"

  - effect_id: "transitive_dependency_inheritance"
    trigger: "Feature dependencies are inherited transitively"
    consequence:
      - "Optional dependencies must only add serialization derives"
      - "Execution engines must NEVER be optional dependencies"
      - "Tool smuggling prevents graduation and breaks warranty"
    mitigation:
      - "Audit all transitive dependencies in feature closure"
      - "Run audit-no-engine-in-ts-feature and audit-no-engine-in-wasm-feature"

