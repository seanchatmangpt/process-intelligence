## Refusal Protocol: Tool Smuggling Detection

rule_id: "tool-smuggling-into-compat"

trigger_conditions:
  - "Feature 'ts' or 'wasm' imports discovery, replay, conformance, OCPQ, or benchmark-execution modules"
  - "Execution engine code reachable through feature-gated imports"
  - "Forbidden tool present in dependency closure: eval, Function constructor, process.exit, child_process"

refusal_action:
  code: "ERR_TOOL_SMUGGLING_INTO_COMPAT"
  severity: "FATAL"
  message: "Tool smuggling detected: Execution engines belong downstream in wasm4pm; compat is strictly structure-only."
  remedy:
    - "Remove execution engine imports from feature-gated code"
    - "Delete optional dependency on any execution tool"
    - "Refactor downstream boundary: move execution logic to wasm4pm crate"
    - "Re-run audit-no-engine-in-feature.sh to confirm remediation"

