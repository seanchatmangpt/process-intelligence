version: "30.1.2"
classification: "Non-Projectable / Internal Type Ledger"
authority: "Antigravity boundary audit"
date: "2026-06-01"

description: >
  This ledger lists all public structures, enums, traits, and fields in the wasm4pm-compat surface that are classified as
  non-projectable / internal. These are compile-time assertion gates, private seals, proof tokens, or local generation
  algorithms. They must not cross system boundaries, and the Rust compiler strictly enforces their privacy and unconstructibility
  to prevent bypasses of the underlying process intelligence safety covenant.

non_projectable_types:
  - category: "Private Module Seals & Unconstructible Marks"
    description: "Private structural elements preventing forgery of soundness states or lifecycle positions."
    types:
      - name: "wfnet_seal::WfNetSeal"
        kind: "struct"
        compiler_enforcement: "Private type in a private module. Field `_seal` inside WfNetConst cannot be named or initialized outside."
        justification: "Prevents downstream code from fabricating WfNetConst<{Witnessed}> soundness claims without a real SoundnessProof."
      - name: "EvidenceState Trait Seal"
        kind: "trait"
        compiler_enforcement: "Sealed trait pattern. Supertrait is private, preventing downstream crates from implementing it."
        justification: "Restricts the set of evidence lifecycles (Raw, Parsed, Admitted, etc.) to the 7 sanctioned typestates."
      - name: "IsPlaceNode / IsTransitionNode Seals"
        kind: "trait"
        compiler_enforcement: "Private supertrait requirement."
        justification: "Locks Petri net node types to PlaceNodeMarker and TransitionNodeMarker, enforcing bipartite arc invariants."
      - name: "Evidence::admit Private Constructor"
        kind: "method"
        compiler_enforcement: "Visibility restricted to pub(crate). Direct constructor bypassed in favor of Admit::admit()."
        justification: "Forces raw inputs to survive the 11 validation gates before transitioning to Admitted."

  - category: "Zero-Cost Compile-Time Constraints"
    description: "Type-level machinery evaluating boolean or rational parameters at compile time."
    types:
      - name: "Assert<const OK: bool>"
        kind: "struct"
        compiler_enforcement: "Associated trait IsTrue only implemented for Assert<true>."
        justification: "Zero-cost type-level gate. Generates compilation error (E0277) if evaluated constant is false."
      - name: "Require<const OK: bool>"
        kind: "type alias"
        compiler_enforcement: "Resolves to Assert<OK> requiring IsTrue implementation."
        justification: "Short-hand alias used in 'where' bounds of const-generic types."
      - name: "ConditionCell<const BITS: usize>"
        kind: "struct"
        compiler_enforcement: "Require<{ BITS <= 8 }>: IsTrue bounds check."
        justification: "Enforces Blue River Dam covenant that a single condition cell holds at most 8 primary bits (Need9 split)."
      - name: "Between01<const NUM: u64, const DEN: u64>"
        kind: "struct"
        compiler_enforcement: "Require<{ DEN > 0 && NUM <= DEN }>: IsTrue bounds check."
        justification: "Enforces that rational process mining metrics are statically bound in [0, 1]."
      - name: "TypedLoopNode<const ARITY: usize>"
        kind: "struct"
        compiler_enforcement: "Require<{ ARITY == 2 }>: IsTrue bounds check."
        justification: "Enforces block-structured arity rules: a loop node must have exactly 2 children (do-body + redo-body)."
      - name: "ExportBoundaryConst<const HAS_WITNESS: bool, const HAS_ROUND_TRIP: bool>"
        kind: "struct"
        compiler_enforcement: "Static nominal type comparison."
        justification: "Statically distinguishes fully-attested boundaries from unverified boundaries at the type level."

  - category: "Proof Tokens"
    description: "Proof certificates that can only be minted by authorized validators."
    types:
      - name: "SoundnessProof"
        kind: "struct"
        compiler_enforcement: "Private constructor or internal module instantiation only."
        justification: "Serves as evidence that a Petri net has been algorithmically verified as sound (live and safe)."
      - name: "WfNetSoundnessProofOf<N>"
        kind: "struct"
        compiler_enforcement: "Private constructor wrapping net identifier."
        justification: "Binds soundness proof to a specific Petri net instance."

  - category: "Execution & Generation Algorithms"
    description: "Code generation, Jinja2 rendering, and disk-writing logic."
    types:
      - name: "RenderEngine"
        kind: "struct"
        compiler_enforcement: "Holds non-serializable context maps, runs local parsing logic."
        justification: "Local utility for template rendering; has no business crossing FFI/WASM bounds."
      - name: "RustGenerator"
        kind: "struct"
        compiler_enforcement: "Contains local PathBuf directories and runs std::process::Command for rustc checks."
        justification: "Disk-writing generator for creating Rust modules. Relies on local file system structures."
      - name: "TomlGenerator"
        kind: "struct"
        compiler_enforcement: "PathBuf based disk writer."
        justification: "Disk-writing generator for TOML files."
      - name: "ReceiptLedger"
        kind: "struct"
        compiler_enforcement: "Internal volatile hashmap storing generated receipts."
        justification: "Active in-memory database of manufactured receipts, not a projectable evidence item itself."
      - name: "ComplianceAuditor"
        kind: "struct"
        compiler_enforcement: "Algorithm container with static audit functions."
        justification: "Performs code string verification; contains check algorithms."
      - name: "PowerPointGenerator"
        kind: "struct"
        compiler_enforcement: "Algorithm container."
        justification: "Renders textual slides and matches claims to ledger receipts."
      - name: "RQGenerator"
        kind: "struct"
        compiler_enforcement: "Algorithm container."
        justification: "Compiles rules to Research Question programs."
      - name: "StrictCheck"
        kind: "struct"
        compiler_enforcement: "Local verification algorithm."
        justification: "Verifies process boundary compliance checks."
      - name: "ProcessBoundary"
        kind: "struct"
        compiler_enforcement: "Enforces inter-crate process validation."
        justification: "Internal boundary marker."
