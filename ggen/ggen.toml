# ggen — Governance Generation Engine
# Substrate for M&A deck, diligence workbook, and Blue River orchestrator
# Built on process intelligence ontology, SPARQL queries, and Tera templates

[project]
name = "process-intelligence-ggen"
version = "0.1.0"
description = "Generate board-admissible M&A assets and autonomic governance engines from process intelligence"
evidence_sources = ["../receipts", "../checkpoints"]

[ontology]
source = "ontology-extensions.ttl"
# wasm4pm-compat law manufacturing uses dedicated ontology
wasm4pm_compat_source = "wasm4pm-compat.ttl"

[[inference.rules]]
name = "normalize"
description = "Pass-through normalization to satisfy DMAIC measurement gates"
construct = "CONSTRUCT { ?s ?p ?o } WHERE { ?s ?p ?o . FILTER(false) }"
order = 1

# Unused M&A rules deactivated for visualizer focus

# wasm4pm-compat Law Manufacturing Rules

[[generation.rules]]
name = "wasm4pm-compat-witness-markers"
description = "Extract witness marker projections for Rust enum generation"
query = { file = "queries/select-witness-projections.rq" }
template = { file = "templates/witness-marker.tera" }
output_file = "../sources/wasm4pm-compat/manufactured/witnesses/witness-markers-20260601.rs"
mode = "Overwrite"
metadata = {
  format = "rust",
  audience = "wasm4pm-compat Type System",
  compliance = "Lattice monotonicity (join-semilattice properties)",
  evidence_backing = "witness lattice completeness audit"
}

[[generation.rules]]
name = "wasm4pm-compat-process-forms"
description = "Extract process form definitions for type-law documentation"
query = { file = "queries/select-process-forms.rq" }
template = { file = "templates/process-form.tera" }
output_file = "../sources/wasm4pm-compat/manufactured/forms/process-forms-20260601.md"
mode = "Overwrite"
metadata = {
  format = "markdown",
  audience = "Process Intelligence Research Foundry",
  compliance = "Process form admissibility boundaries",
  evidence_backing = "type-law atlas + process form coverage matrix"
}

[[generation.rules]]
name = "wasm4pm-compat-boundary-law"
description = "Extract boundary crossing definitions for WebAssembly type-safe export"
query = { file = "queries/select-boundary-crossings.rq" }
template = { file = "templates/wasm-boundary.tera" }
output_file = "../sources/wasm4pm-compat/manufactured/boundaries/boundary-law-20260601.wit"
mode = "Overwrite"
metadata = {
  format = "wit",
  audience = "wasm4pm Execution Engine",
  compliance = "WASM component model type safety",
  evidence_backing = "boundary crossing law enforcement + signature admissibility"
}

# Generation rules for Blue River orchestrator
[[generation.rules]]
name = "blue-river-orchestrator"
description = "Autonomic MAPE-K governance engine with lifecycle state transitions"
query = { file = "queries/extract-lifecycle-governance.rq" }
template = { file = "templates/blue-river.tera" }
output_file = "../blue_river_dam/src/lib.rs"
mode = "Overwrite"
metadata = {
  format = "rust",
  audience = "Process Intelligence Runtime",
  compliance = "MAPE-K autonomic loop",
  evidence_backing = "lifecycle state machine + governance rule enforcement"
}

